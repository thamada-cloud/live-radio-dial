                <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: #d1d5db;"></div>
                <span style="padding-left: 12px;">{{ col.label }}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Schedule body -->
  <div style="padding-left: 16px; padding-bottom: 128px; position: relative;">
    <div style="max-width: 1600px; width: 100%;">
      <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; padding-bottom: 32px;">
        <div ref="{{ setBodyEl }}" sc-camel-on-scroll="{{ onBodyScroll }}" style="position: relative; width: 100%; overflow-x: auto; overflow-y: visible; padding-right: 16px; scrollbar-width: none;">

          <div style="position: absolute; top: 0; bottom: 0; width: 2px; background: var(--rd-accent, #c6002b); z-index: 5; pointer-events: none; left: {{ indicatorLeft }}px;">
            <div style="position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--rd-accent, #c6002b);"></div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px; min-width: max-content;">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;: {&quot;width&quot;: 430, &quot;height&quot;: 900}, &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#c6002b&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#c6002b&quot;, &quot;#1d4ed8&quot;, &quot;#047857&quot;, &quot;#7c3aed&quot;, &quot;#db2777&quot;], &quot;section&quot;: &quot;Theme&quot;}, &quot;showAd&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}, &quot;autoPlay&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}}">
class Component extends DCLogic {
  // ---- research build configuration ----
  // Flip these back to the demo defaults (adsEnabled/externalLinks true,
  // pinnedNow null) for a sales or stakeholder demo. They are set for
  // unmoderated research, where every participant must see the same thing.
  static RESEARCH = {
    // A fixed wall clock for the whole app. Without this the grid renders only
    // from the real current hour to 11pm, so a 10am participant sees thirteen
    // columns and a 9pm participant sees two, which caps the study's primary
    // exploration measure by time of day. Format: [hour, minute], 24h.
    pinnedNow: [9, 20],
    // setupAds otherwise starts a cycle 30s after load regardless of the
    // showAd prop: a 300x250 appears, rotates every 10s, hides after 30, and
    // returns 120s later. Roughly ten interruptions over a 25-minute session.
    adsEnabled: false,
    // "Go to Station" otherwise window.opens the station homepage, stranding
    // an unmoderated participant on an external site with no way back.
    externalLinks: false,
  };

  // Single source of truth for "now". Everything that used to call new Date()
  // routes through here so the pinned clock cannot be bypassed in one place
  // and silently reintroduce the time-of-day confound.
  now() {
    const pin = Component.RESEARCH.pinnedNow;
    if (!pin) return new Date();
    const d = new Date();
    d.setHours(pin[0], pin[1], 0, 0);
    return d;
  }

  // Station lineup and fixed schedules live in data/stations.js, loaded
  // before this script. See the header comment there for provenance.
  stationData = window.LRD_STATIONS;
  adImages = [window.__resources.adHeinz, window.__resources.adNespresso, window.__resources.adGerber];

  constructor(props) {
    super(props);
    const stations = this.buildStations();
    let favorites = new Set();
    try { const s = localStorage.getItem('favoriteStations'); if (s) favorites = new Set(JSON.parse(s)); } catch (e) {}

    // The participant is treated as already loyal to one station: it starts
    // playing and starts favorited. Task 5 of the study asks them to get back to
    // "the station you usually listen to" after exploring, which has nothing to
    // measure unless they arrived with one. Falls back to the first row if the
    // configured id is not in the lineup.
    const home = stations.find(s => s.id === window.LRD_HOME_STATION) || stations[0];
    if (home && !favorites.size) favorites.add(home.id);

    const now = this.now();
    const first = home;
    const show = first ? this.currentShowFor(first, now) : null;
    this.state = {
      stations,
      currentStationId: first ? first.id : null,
      currentShowId: show ? show.id : null,
      isPlaying: false, isBuffering: false,
      favorites, currentTime: now,
      activeSheet: null, filterPage: 'main',
      filters: { location: null, genre: null, sort: null },
      adVisible: false, adIndex: 0,
      scrolledY: false, scrolledX: false,
      liked: false, disliked: false, error: null,
    };
    this.timers = [];
  }

  // ---- data building ----
  // Fixed schedules, read straight from data/stations.js. This replaces a
  // generator that used Math.random() for durations and hosts, which meant no
  // two participants saw the same grid and neither did one participant across
  // a reload. Day-parts in the data match the clock, so titles no longer
  // desync from the hour they sit in.
  scheduleFor(station) {
    return (station.shows || []).map(sh => ({
      id: `${station.id}-${sh.start}`,
      title: sh.title,
      host: sh.host,
      startTime: `${String(sh.start).padStart(2,'0')}:00`,
      endTime: `${String(sh.end).padStart(2,'0')}:00`,
    }));
  }
  isMusicStation(genre) {
    const g = (genre || '').toLowerCase();
    return !['news', 'talk', 'sports', 'public radio'].some(k => g.includes(k));
  }
  buildStations() {
    // Genre, location, logo and stream all come straight from the data file now.
    // They used to be derived: genre from the first freeform tag, location from
    // country/state/city, logo from a uuid lookup. The data is authoritative
    // (pulled from iHeart's live API), so deriving it would only lose fidelity.
    const list = this.stationData.map(rb => {
      const m = (rb.dial || '').match(/(\d+(?:\.\d+)?)/);
      return {
        id: rb.id, name: rb.name, logo: rb.logo,
        genre: rb.genre, location: rb.location,
        dial: rb.dial, callLetters: rb.callLetters,
        shows: this.scheduleFor(rb),
        streamUrl: rb.stream, homepage: rb.homepage,
        description: rb.description,
        frequency: m ? parseFloat(m[1]) : undefined
      };
    });
    // Dial order, not alphabetical. A radio dial is the mental model the whole
    // design borrows from, and sorting FM before AM then by frequency is how a
    // listener scans one. Alphabetical put "103.5 KTU" next to "106.7 Lite FM"
    // and buried Z100 at the bottom.
    list.sort((a, b) => {
      const band = (s) => /AM/i.test(s.dial || '') ? 1 : 0;
      if (band(a) !== band(b)) return band(a) - band(b);
      return (a.frequency || 0) - (b.frequency || 0);
    });
    return list;
  }
  currentShowFor(station, now) {
    const h = now.getHours();
    return station.shows.find(s => {
      const sh = parseInt(s.startTime.split(':')[0]);
      const eh = parseInt(s.endTime.split(':')[0]);
      return h >= sh && h < eh;
    }) || station.shows[0];
  }

  // ---- lifecycle ----
  componentDidMount() {
    this.applyAccent();
    this.audio = new Audio();
    this.audio.preload = 'none';
    this.audio.addEventListener('playing', () => this.setState({ isPlaying: true, isBuffering: false }));
    this.audio.addEventListener('pause', () => this.setState({ isPlaying: false }));
    this.audio.addEventListener('waiting', () => this.setState({ isBuffering: true }));
    this.audio.addEventListener('error', () => {
      this.setState({ isBuffering: false, error: 'Unable to play this stream' });
      this.timers.push(setTimeout(() => this.setState({ error: null }), 4000));
    });
    const cur = this.getStation(this.state.currentStationId);
    if (cur && cur.streamUrl) { this.audio.src = cur.streamUrl; }
    if (this.props.autoPlay && cur && cur.streamUrl) { this.tryPlay(); }

    this.timers.push(setInterval(() => this.setState({ currentTime: this.now() }), 60000));
    this._onScroll = () => { const s = window.scrollY > 10; if (s !== this.state.scrolledY) this.setState({ scrolledY: s }); };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this.setupAds();
  }
  componentDidUpdate() { this.applyAccent(); }
  componentWillUnmount() {
    this.timers.forEach(t => { clearTimeout(t); clearInterval(t); });
    if (this.audio) { this.audio.pause(); this.audio.src = ''; }
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
    [this.adInitTimer, this.adHideTimer, this.adNextTimer, this.adRotTimer].forEach(t => { clearTimeout(t); clearInterval(t); });
  }

  darken(hex, amt) {
    try { let c = hex.replace('#',''); if (c.length === 3) c = c.split('').map(x=>x+x).join(''); const n = parseInt(c,16);
      let r = Math.round(((n>>16)&255)*(1-amt)), g = Math.round(((n>>8)&255)*(1-amt)), b = Math.round((n&255)*(1-amt));
      return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); } catch(e){ return hex; }
  }
  applyAccent() {
    if (!this.rootEl) return;
    const a = this.props.accentColor || '#c6002b';
    this.rootEl.style.setProperty('--rd-accent', a);
    this.rootEl.style.setProperty('--rd-accentDark', this.darken(a, 0.15));
  }

  setupAds() {
    if (!Component.RESEARCH.adsEnabled) return;
    const rotate = () => this.setState(s => ({ adIndex: Math.min(s.adIndex + 1, this.adImages.length - 1) }));
    if (this.props.showAd) { this.setState({ adVisible: true, adIndex: 0 }); this.adRotTimer = setInterval(rotate, 3000); return; }
    const startCycle = () => {
      this.setState({ adVisible: true, adIndex: 0 });
      this.adRotTimer = setInterval(rotate, 10000);
      this.adHideTimer = setTimeout(() => {
        clearInterval(this.adRotTimer);
        this.setState({ adVisible: false });
        this.adNextTimer = setTimeout(startCycle, 120000);
      }, 30000);
    };
    this.adInitTimer = setTimeout(startCycle, 30000);
  }

  // ---- helpers ----
  getStation(id) { return this.state.stations.find(s => s.id === id); }
  getShow(station, id) { return station ? station.shows.find(s => s.id === id) : null; }
  getFiltered() {
    const { stations, filters } = this.state;
    let f = [...stations];
    if (filters.location) f = f.filter(s => s.location === filters.location);
    if (filters.genre) f = f.filter(s => s.genre === filters.genre);
    // "Default" preserves the dial order established in buildStations (FM by
    // frequency, then AM). It used to fall through to a name sort, which had two
    // bad effects: it silently overrode the dial order, and it made the Sort
    // sheet's "Default" and "A-Z" options behave identically, so two of the four
    // controls did the same thing.
    if (filters.sort === 'a-z') f.sort((a,b)=>a.name.localeCompare(b.name));
    else if (filters.sort === 'z-a') f.sort((a,b)=>b.name.localeCompare(a.name));
    else if (filters.sort === 'frequency') f.sort((a,b)=>{ if(a.frequency===undefined&&b.frequency===undefined)return 0; if(a.frequency===undefined)return 1; if(b.frequency===undefined)return -1; return a.frequency-b.frequency; });
    return f;
  }
  tryPlay() { if (!this.audio) return; const p = this.audio.play(); if (p && p.catch) p.catch(()=>{}); }

  // ---- actions ----
  onPlayPause = () => { if (this.state.isPlaying) { this.audio && this.audio.pause(); } else { this.tryPlay(); } };
  setStation(station, autoplay) {
    if (!station) return;
    const show = this.currentShowFor(station, this.now());
    this.setState({ currentStationId: station.id, currentShowId: show ? show.id : null });
    if (this.audio && station.streamUrl) { this.audio.src = station.streamUrl; if (autoplay) this.tryPlay(); }
  }
  selectShow = (stationId, showId) => {
    const station = this.getStation(stationId); if (!station) return;
    const show = this.getShow(station, showId);
    this.setState({ currentStationId: stationId, currentShowId: showId });
    if (this.audio && station.streamUrl) {
      this.audio.src = station.streamUrl;
      const h = this.now().getHours();
      const sh = parseInt(show.startTime.split(':')[0]), eh = parseInt(show.endTime.split(':')[0]);
      const airing = h >= sh && h < eh;
      if (!this.state.isPlaying && airing) this.timers.push(setTimeout(() => this.tryPlay(), 300));
    }
  };
  onNext = () => { const f = this.getFiltered(); if (!f.length) return; const i = f.findIndex(s=>s.id===this.state.currentStationId); this.setState({liked:false,disliked:false}); this.setStation(f[(i+1)%f.length], true); };
  onPrevious = () => { const f = this.getFiltered(); if (!f.length) return; const i = f.findIndex(s=>s.id===this.state.currentStationId); this.setState({liked:false,disliked:false}); this.setStation(f[(i-1+f.length)%f.length], true); };
  toggleFav = (id) => {
    this.setState(s => { const n = new Set(s.favorites); n.has(id) ? n.delete(id) : n.add(id);
      try { localStorage.setItem('favoriteStations', JSON.stringify(Array.from(n))); } catch(e){}
      return { favorites: n }; });
  };
  onLike = () => { this.setState(s=>({liked:!s.liked, disliked:false})); if(this.state.currentStationId) this.toggleFav(this.state.currentStationId); };
  onDislike = () => this.setState(s=>({disliked:!s.disliked, liked:false}));
  openFilter = () => this.setState({ activeSheet: 'filter', filterPage: 'main' });
  openMediaMenu = () => this.setState({ activeSheet: 'media-menu' });
  closeSheet = () => this.setState({ activeSheet: null });
  onGoToStation = () => { const st = this.getStation(this.state.currentStationId); if (Component.RESEARCH.externalLinks && st && st.homepage) window.open(st.homepage, '_blank'); this.closeSheet(); };

  renderVals() {
    const { stations, filters, currentTime, currentStationId, currentShowId, favorites,
      isPlaying, isBuffering, adVisible, adIndex, scrolledY, scrolledX, liked, disliked, error,
      activeSheet, filterPage } = this.state;

    // time slots
    const all = []; for (let h = 8; h <= 23; h++) { const disp = `${h>12?h-12:h===0?12:h}:00 ${h>=12?'PM':'AM'}`; all.push({ display: disp, hour: h }); }
    const curHour = currentTime.getHours();
    const visible = all.filter(s => s.hour >= curHour);
    const vis = visible.length ? visible : [all[all.length-1]];
    const headerCols = [{ label: 'Now Playing' }].concat(vis.slice(1).map(s => ({ label: s.display })));
    const mins = currentTime.getMinutes();
    const indicatorLeft = 40 + 8 + 66 + 8 + (mins/60)*210;

    const filtered = this.getFiltered();
    const curStation = this.getStation(currentStationId);
    const curShow = curStation ? this.getShow(curStation, currentShowId) : null;

    // station rows
    const showForSlot = (station, hour) => station.shows.find(s => { const sh=parseInt(s.startTime.split(':')[0]), eh=parseInt(s.endTime.split(':')[0]); return hour>=sh && hour<eh; });
    const stationRows = filtered.map(station => {
      const favorited = favorites.has(station.id);
      const cells = [];
      vis.forEach((slot, index) => {
        const show = showForSlot(station, slot.hour);
        if (show && index > 0) { const prev = showForSlot(station, vis[index-1].hour); if (prev && prev.id === show.id) return; }
        if (!show) { cells.push({ isShow:false, isEmpty:true, width:210, key:`${station.id}-e-${slot.hour}` }); return; }
        const sh = parseInt(show.startTime.split(':')[0]), eh = parseInt(show.endTime.split(':')[0]);
        const span = eh - sh; const width = span===1 ? 210 : (210*span)+(8*(span-1));
        cells.push({
          isShow:true, isEmpty:false, width, key:`${station.id}-${show.id}`,
          // Host first: it is the only per-cell signal that varies down a row,
          // so it is what makes the time axis worth reading. The station tagline
          // that used to sit here repeated identically in every cell of a row,
          // and the station is already identified by the pinned logo column.
          title: show.title, subtitle: `${show.host ? show.host + ' • ' : ''}${station.name}`,
          isPlaying: currentStationId===station.id && currentShowId===show.id,
          onClick: () => this.selectShow(station.id, show.id)
        });
      });
      return { id: station.id, name: station.name, logo: station.logo, favorited,
        favIcon: favorited ? window.__resources.favRemove : window.__resources.favAdd,
        onToggleFav: () => this.toggleFav(station.id), cells };
    });

    // now playing
    const title = curShow ? curShow.title : '';
    const artist = curStation ? curStation.name : '';
    const artwork = curStation ? curStation.logo : '';
    const isMusic = curStation ? this.isMusicStation(curStation.genre) : true;
    const shouldMarquee = (title || '').length > 30;

    // filters
    const locs = Array.from(new Set(stations.map(s=>s.location).filter(Boolean))).sort();
    const gens = Array.from(new Set(stations.map(s=>s.genre).filter(Boolean))).sort();
    const locCounts = {}; stations.forEach(s => { if (s.location) locCounts[s.location]=(locCounts[s.location]||0)+1; });
    const genCounts = {}; stations.forEach(s => { if (s.genre) genCounts[s.genre]=(genCounts[s.genre]||0)+1; });
    const accent = this.props.accentColor || '#c6002b';
    const optStyle = (sel) => sel ? { bg: 'rgba(198,0,43,0.10)', color: accent } : { bg: 'transparent', color: '#27292d' };
    const locationOptions = [{ label:'All Locations', selected: filters.location===null, countLabel:'', onClick:()=>this.setState({filters:{...filters,location:null}}), ...optStyle(filters.location===null) }]
      .concat(locs.map(l => ({ label:l, selected: filters.location===l, countLabel:`(${locCounts[l]})`, onClick:()=>this.setState({filters:{...filters,location:l}}), ...optStyle(filters.location===l) })));
    const genreOptions = [{ label:'All Genres', selected: filters.genre===null, countLabel:'', onClick:()=>this.setState({filters:{...filters,genre:null}}), ...optStyle(filters.genre===null) }]
      .concat(gens.map(g => ({ label:g, selected: filters.genre===g, countLabel:`(${genCounts[g]})`, onClick:()=>this.setState({filters:{...filters,genre:g}}), ...optStyle(filters.genre===g) })));
    const sortDefs = [['Default',null],['A-Z','a-z'],['Z-A','z-a'],['Frequency','frequency']];
    const sortOptions = sortDefs.map(([label,val]) => ({ label, selected: filters.sort===val, onClick:()=>this.setState({filters:{...filters,sort:val}}), ...optStyle(filters.sort===val) }));
    const sortLabel = filters.sort==='a-z'?'A-Z':filters.sort==='z-a'?'Z-A':filters.sort==='frequency'?'Frequency':'Default';
    const hasActive = filters.location!==null || filters.genre!==null || filters.sort!==null;

    return {
      noop: () => {}, onBack: () => {},
      // now playing
      notAd: !adVisible, adVisible, adImage: this.adImages[adIndex],
      artwork, title, artist, shouldMarquee, notMarquee: !shouldMarquee,
      notMusic: !isMusic, musicOpacity: isMusic ? 1 : 0.3,
      onLike: this.onLike, onDislike: this.onDislike, onPlaylist: () => {},
      likeBg: liked ? 'rgba(39,41,45,0.1)' : 'transparent', liked, notLiked: !liked,
      dislikeBg: disliked ? 'rgba(39,41,45,0.1)' : 'transparent', disliked, notDisliked: !disliked,
      dismissAd: () => this.setState({ adVisible: false }),
      npShadow: scrolledY ? '0 4px 12px rgba(0,0,0,0.08)' : 'none',
      error,
      // schedule
      headerCols, indicatorLeft, stationRows, logoShadow: scrolledX ? '4px 0 8px rgba(0,0,0,0.1)' : 'none',
      setHeaderEl: el => { this.headerEl = el; }, setBodyEl: el => { this.bodyEl = el; },
      onBodyScroll: e => { const sl = e.currentTarget.scrollLeft; if (this.headerEl) this.headerEl.scrollLeft = sl; const s = sl > 0; if (s !== this.state.scrolledX) this.setState({ scrolledX: s }); },
      onHeaderScroll: e => { if (this.bodyEl) this.bodyEl.scrollLeft = e.currentTarget.scrollLeft; },
      setRootEl: el => { this.rootEl = el; this.applyAccent(); },
      // media controls
      isBuffering, showPause: !isBuffering && isPlaying, showPlay: !isBuffering && !isPlaying,
      onPlayPause: this.onPlayPause, onNext: this.onNext, onPrevious: this.onPrevious, openMediaMenu: this.openMediaMenu,
      // sheets
      mediaSheetOpen: activeSheet === 'media-menu', mediaSheetTitle: curShow ? curShow.title : 'Now Playing',
      filterOpen: activeSheet === 'filter', closeSheet: this.closeSheet, openFilter: this.openFilter, onGoToStation: this.onGoToStation,
      filterMain: filterPage === 'main', filterNotMain: filterPage !== 'main',
      filterLocationPage: filterPage === 'location', filterGenrePage: filterPage === 'genre', filterSortPage: filterPage === 'sort',
      filterTitle: filterPage==='location'?'Location':filterPage==='genre'?'Genre':filterPage==='sort'?'Sort':'Filters',
      filterBack: () => this.setState({ filterPage: 'main' }),
      goLocation: () => this.setState({ filterPage: 'location' }), goGenre: () => this.setState({ filterPage: 'genre' }), goSort: () => this.setState({ filterPage: 'sort' }),
      locationLabel: filters.location || 'All', genreLabel: filters.genre || 'All', sortLabel,
      showClearAll: filterPage === 'main' && hasActive, clearAll: () => this.setState({ filters: { location:null, genre:null, sort:null } }),
      locationOptions, genreOptions, sortOptions,
    };
  }
}
</script>

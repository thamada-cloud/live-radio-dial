<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Radio Dial v2</title>
<script src="data/stations.js"></script>
<script src="data/stations-us.js"></script>
<script src="data/schedule.js"></script>
<style>
  /* Design tokens, as named in the Figma file (Live-Radio-Dial-v2, node 314:13377) */
  :root{
    --surface-app:#f6f8f9;
    --surface-app-overlay:rgba(0,0,0,.7);
    --surface-shadow:rgba(0,0,0,.12);
    --on-surface-primary:#27292d;
    --on-surface-secondary:#3f4447;
    --on-surface-brand-monochrome:#000;
    --container-quaternary:#e6eaed;
    --brand-red:#c6002b;
    --radius-primary:6px;
    --radius-circular:999px;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--surface-app);color:var(--on-surface-primary);
    font-family:var(--body);-webkit-font-smoothing:antialiased;
    min-height:100vh;overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;display:flex}
  img{display:block}
  .icon{display:block;width:100%;height:100%}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- top header (status bar + nav), sticky ---------- */
  .top-header{position:sticky;top:0;z-index:40;background:var(--surface-app)}
  .status-bar{display:flex;height:44px;align-items:center;justify-content:space-between}
  .status-bar .time{
    width:134px;text-align:center;font-size:17px;line-height:22px;font-weight:600;
    color:var(--on-surface-brand-monochrome);
  }
  .status-bar .levels{width:134px;display:flex;justify-content:center}
  .status-bar .levels img{width:78px}
  .nav{display:flex;height:44px;align-items:center;gap:4px;padding-right:16px}
  .nav h1{
    flex:1;min-width:0;font-size:20px;line-height:24px;font-weight:600;
    color:var(--on-surface-brand-monochrome);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .btn-icon{padding:4px;border-radius:var(--radius-circular)}
  .btn-icon:hover{background:rgba(0,0,0,.05)}
  .btn-icon .icon{width:24px;height:24px}

  /* ---------- now playing ---------- */
  .page{padding:0 16px;display:flex;flex-direction:column;gap:16px;padding-bottom:140px}
  .now{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .art{
    width:248px;height:248px;border-radius:var(--radius-primary);overflow:hidden;
    filter:drop-shadow(0 1px 1.5px var(--surface-shadow));background:#fff;
  }
  .art img{width:100%;height:100%;object-fit:cover}
  .meta-row{display:flex;align-items:center;justify-content:space-between;width:100%}
  .copy{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
  .copy .title{
    font-size:16px;line-height:18px;font-weight:600;color:var(--on-surface-primary);
    white-space:nowrap;overflow:hidden;
  }
  .copy .subtitle{
    font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-secondary);
    white-space:nowrap;overflow:hidden;
  }
  /* 60px fade so long track/artist strings run out rather than hard-clip */
  .copy::after{
    content:"";position:absolute;top:0;bottom:0;right:0;width:60px;pointer-events:none;
    background:linear-gradient(to right,rgba(246,248,249,0) 45%,var(--surface-app) 95%);
  }
  .thumbs{display:flex;align-items:center;justify-content:flex-end;flex-shrink:0}
  .thumbs button{padding:4px;border-radius:var(--radius-circular)}
  .thumbs button:hover{background:rgba(0,0,0,.05)}
  .thumbs button[aria-pressed="true"]{background:rgba(39,41,45,.1)}
  .thumbs .icon{width:32px;height:32px}

  /* ---------- filter chips ---------- */
  .chips{
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    margin:8px -16px 0;padding:0 16px;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;
    border:1px solid var(--on-surface-primary);border-radius:var(--radius-circular);
    padding:8px 16px;font-size:14px;line-height:16px;font-weight:600;
    color:var(--on-surface-primary);white-space:nowrap;
  }
  .chip .icon{width:16px;height:16px}
  .chip[aria-pressed="true"]{background:var(--on-surface-primary);color:#fff}
  .chip[aria-pressed="true"] .icon{filter:invert(1) brightness(2)}

  /* ---------- station guide (a list in v2, not a grid) ---------- */
  .guide{display:flex;flex-direction:column;gap:8px}
  .station{display:flex;gap:8px;align-items:center}
  .station .logo{
    width:66px;height:66px;flex-shrink:0;border-radius:var(--radius-primary);
    background:#fff;box-shadow:0 1px 3px 0 var(--surface-shadow);overflow:hidden;
  }
  .station .logo img{width:100%;height:100%;object-fit:cover}
  .station .row{
    flex:1;min-width:0;height:66px;min-height:44px;display:flex;align-items:center;gap:8px;
    background:var(--container-quaternary);border-radius:var(--radius-primary);
    padding:0 16px;border:2px solid transparent;text-align:left;
  }
  .station.is-playing .row{border-color:var(--brand-red)}
  .station .row .metadata{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
  .station .row .show{
    font-size:14px;line-height:16px;font-weight:600;color:var(--on-surface-secondary);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .station .row .when{
    font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-primary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .station .row .more{padding:4px;border-radius:var(--radius-circular);flex-shrink:0}
  .station .row .more .icon{width:24px;height:24px}
  .empty{padding:32px 0;text-align:center;color:var(--on-surface-secondary);font-size:14px}

  /* ---------- media controls ---------- */
  .controls{position:fixed;left:0;right:0;bottom:24px;z-index:50;padding:0 16px;display:flex;justify-content:center}
  .pill{
    width:100%;max-width:343px;height:52px;display:flex;align-items:center;justify-content:center;
    gap:16px;padding:4px 8px;border-radius:var(--radius-circular);
    background:var(--surface-app-overlay);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .pill button{padding:4px;border-radius:var(--radius-circular);flex-shrink:0}
  .pill .icon{width:32px;height:32px}
  /* 72px control inside a 52px pill, exactly as the design overflows it */
  .pill .primary{
    background:var(--brand-red);padding:4px;border-radius:var(--radius-circular);
    filter:drop-shadow(0 1px 1.5px var(--surface-shadow));margin:-10px 0;
  }
  .pill .primary .icon{width:64px;height:64px}
  .pill button:not(.primary):hover{background:rgba(255,255,255,.2)}

  /* Subtle fade so the list dissolves under the control pill rather than being
     cut off by it. Same treatment as v1. */
  .bottom-fade{
    position:fixed;left:0;right:0;bottom:0;height:128px;z-index:20;pointer-events:none;
    background:linear-gradient(to top,var(--surface-app),transparent);
  }

  .error{
    position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--brand-red);color:#fff;padding:12px 16px;border-radius:8px;
    font-size:14px;font-weight:500;box-shadow:0 10px 15px rgba(0,0,0,.2);max-width:calc(100% - 32px);
  }

  /* ---------- bottom sheet (matches the v1 filter sheet pattern) ---------- */
  @keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4)}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:101;display:flex;flex-direction:column;
    background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);
    max-height:80vh;animation:sheet-up .3s ease-out;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet .grabber{display:flex;justify-content:center;padding:12px 0 8px}
  .sheet .grabber i{width:40px;height:4px;border-radius:999px;background:#d1d5db;display:block}
  .sheet header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 24px 16px;border-bottom:1px solid #e5e7eb;
  }
  .sheet header h2{font-size:20px;line-height:24px;font-weight:600;color:var(--on-surface-primary)}
  .sheet header button{padding:8px;border-radius:var(--radius-circular)}
  .sheet header button:hover{background:#f3f4f6}
  .sheet header .icon{width:20px;height:20px}
  .sheet .options{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:4px}
  .sheet .option{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 16px;border-radius:8px;background:transparent;text-align:left;
  }
  .sheet .option:hover{background:#f3f4f6}
  .sheet .option .label{display:flex;align-items:center;gap:8px;min-width:0}
  .sheet .option .name{font-weight:500;color:var(--on-surface-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .option .count{font-size:14px;color:#6b7280;flex-shrink:0}
  .sheet .option .icon{width:20px;height:20px;flex-shrink:0}
  .sheet .option[aria-selected="true"]{background:rgba(198,0,43,.1)}
  .sheet .option[aria-selected="true"] .name{color:var(--brand-red)}
  .sheet .option[aria-selected="true"] .icon{filter:invert(16%) sepia(96%) saturate(5000%) hue-rotate(338deg) brightness(85%) contrast(105%)}
  .sheet footer{padding:16px 24px;border-top:1px solid #e5e7eb;background:#f9fafb}
  .sheet footer button{
    width:100%;justify-content:center;background:var(--brand-red);color:#fff;
    padding:12px;border-radius:8px;font-weight:500;
  }
  .sheet footer button:hover{background:#a00023}
  /* Location sheet rows, per iOS HeaderSheetStyle:
     locationRowCellHeight 64, locationRowEdgeInsets 4, icon 20,
     title = body3, subtitle = caption1 in grey400. */
  .sheet .loc-row{
    width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:0 4px;background:transparent;text-align:left;
  }
  .sheet .loc-row:hover{background:#f3f4f6;border-radius:8px}
  .sheet .loc-row .text{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sheet .loc-row .t{font-size:16px;line-height:20px;color:var(--on-surface-primary)}
  .sheet .loc-row .s{font-size:12px;line-height:16px;letter-spacing:-.35px;color:#9ca3af;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .loc-row .icon{width:20px;height:20px;flex-shrink:0;color:var(--on-surface-primary)}
  .sheet .loc-row .icon.dim{opacity:.35}
  .sheet .back{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 0;border-radius:8px}
  .sheet .back .icon{width:20px;height:20px}
  .sheet .city-search{
    width:100%;margin-bottom:8px;padding:10px 12px;font:inherit;font-size:16px;
    border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--on-surface-primary);
  }
  .sheet .city-search:focus{outline:2px solid var(--brand-red);outline-offset:-1px}
  .sheet .note{padding:0 24px 16px;font-size:13px;line-height:18px;color:#6b7280}
  [hidden]{display:none !important}
</style>
</head>
<body>

<header class="top-header">
  <div class="status-bar" id="statusBar">
    <div class="time">9:41</div>
    <div class="levels"><img class="icon" src="assets/v2/status-levels.svg" alt=""></div>
  </div>
  <div class="nav">
    <button class="btn-icon" aria-label="Back"><img class="icon" src="assets/v2/back.svg" alt=""></button>
    <h1>Live Radio Dial</h1>
    <button class="btn-icon" aria-label="Search"><img class="icon" src="assets/v2/search.svg" alt=""></button>
    <button class="btn-icon" aria-label="AirPlay"><img class="icon" src="assets/v2/airplay-header.svg" alt=""></button>
  </div>
</header>

<main class="page">
  <section class="now">
    <div class="art"><img id="npArt" src="" alt=""></div>
    <div class="meta-row">
      <div class="copy">
        <div class="title" id="npTitle"></div>
        <div class="subtitle" id="npSubtitle"></div>
      </div>
      <div class="thumbs">
        <button id="btnDislike" aria-label="Dislike" aria-pressed="false">
          <img class="icon" src="assets/v2/thumb-down.svg" alt="">
        </button>
        <button id="btnLike" aria-label="Like" aria-pressed="false">
          <img class="icon" src="assets/v2/thumb-up.svg" alt="">
        </button>
      </div>
    </div>
  </section>

  <nav class="chips" id="chips" aria-label="Filters"></nav>

  <section class="guide" id="guide"></section>
</main>

<div class="bottom-fade"></div>

<div class="controls">
  <div class="pill">
    <button aria-label="Cast"><img class="icon" src="assets/v2/cast.svg" alt=""></button>
    <!-- Arrows deliberately differ from Figma node 314:13377, which has the down
         chevron on the left and the up chevron on the right. The guide is a
         vertical list, so the left button (previous, moving up the list) has to
         point up and the right button (next, moving down) has to point down.
         Do not "fix" this back to match the frame. -->
    <button id="btnPrev" aria-label="Previous station"><img class="icon" src="assets/v2/chevron-up.svg" alt=""></button>
    <button class="primary" id="btnStop" aria-label="Play"><img class="icon" src="assets/v2/play.svg" alt=""></button>
    <button id="btnNext" aria-label="Next station"><img class="icon" src="assets/v2/chevron-down.svg" alt=""></button>
    <button aria-label="More options"><img class="icon" src="assets/v2/overflow.svg" alt=""></button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber"><i></i></div>
  <header style="gap:8px">
    <button class="back" id="sheetBack" aria-label="Back" hidden><img class="icon" src="assets/v2/sheet-back.svg" alt=""></button>
    <h2 id="sheetTitle"></h2>
    <button id="sheetClose" aria-label="Close"><img class="icon" src="assets/v2/close.svg" alt=""></button>
  </header>
  <div class="options" id="sheetOptions"></div>
  <p class="note" id="sheetNote" hidden></p>
  <footer><button id="sheetApply">Apply</button></footer>
</section>

<div class="error" id="error" hidden></div>

<script>
/* ============================================================================
 * Live Radio Dial v2
 * Built from Figma: Live-Radio-Dial-v2, node 314:13377
 *
 * v2 is a different information architecture from v1, not a restyle. The
 * two-axis EPG grid is gone: there is no time axis and no horizontal scroll.
 * Each station is one row showing what is on right now plus its time range,
 * and the filter icon and bottom sheet are replaced by a scrolling chip row.
 *
 * Deliberately vanilla: v1 runs on the Claude Design x-dc runtime, and keeping
 * v2 independent means neither version can break the other. Both read the same
 * data/stations.js so the lineup and schedules stay in one place.
 * ========================================================================== */

const RESEARCH = {
  // Matches v1 so the two versions are comparable in a study. See v1's
  // Component.RESEARCH for why the clock is pinned rather than live.
  pinnedNow: [9, 20],
  // The Figma frame includes an iOS status bar. Faithful on desktop, but on a
  // real phone it sits under the device's own status bar and reads as a bug.
  // Turn this off before fielding on devices.
  showStatusBar: true,
};

const state = {
  stations: [],
  currentId: null,
  playing: false,
  favorites: new Set(),
  liked: false,
  disliked: false,
  filter: { chip: null, genre: null, location: null },
  sheet: null,
  sheetPage: 'main',
  marketId: 159,            // New York, the default lineup
  citySearch: '',
  locationMethod: 'current',
  zip: '',
};

const $ = (id) => document.getElementById(id);
const now = () => {
  const d = new Date();
  if (RESEARCH.pinnedNow) d.setHours(RESEARCH.pinnedNow[0], RESEARCH.pinnedNow[1], 0, 0);
  return d;
};

/* ---- time formatting: "7:00 - 8:00 AM", "10:00 AM - 2:00 PM" ---- */
const h12 = (h) => (h % 12) || 12;
const mer = (h) => (h % 24) < 12 ? 'AM' : 'PM';
function timeRange(start, end) {
  return mer(start) === mer(end)
    ? `${h12(start)}:00 - ${h12(end)}:00 ${mer(end)}`
    : `${h12(start)}:00 ${mer(start)} - ${h12(end)}:00 ${mer(end)}`;
}
const showAt = (station, hour) =>
  station.shows.find((s) => hour >= s.start && hour < s.end) || station.shows[0];

/* ---- data ---- */
function currentMarket() {
  const m = window.LRD_US.markets.find((x) => x[0] === state.marketId);
  return m ? { id: m[0], city: m[1], state: m[2], count: m[3], label: `${m[1]}, ${m[2]}` }
           : { id: state.marketId, city: '', state: '', count: 0, label: '' };
}

function buildStations() {
  // Hand-authored schedules win where they exist; everything else is
  // deterministic (see data/schedule.js). Matched on the API station id.
  const curated = {};
  (window.LRD_STATIONS || []).forEach((s) => { if (s.apiId) curated[s.apiId] = s; });

  const ids = window.LRD_US.lineups[state.marketId] || [];
  const label = currentMarket().label;

  return ids.map((id) => {
    const s = window.LRD_US.stations[id];
    if (!s) return null;
    const c = curated[id];
    const st = {
      id: `s${id}`, apiId: id, name: s.name, dial: s.dial,
      callLetters: s.call,
      genre: c ? c.genre : s.genre,
      description: c ? c.description : s.desc,
      logo: s.logo, stream: s.stream, location: label,
      shows: c && c.shows ? c.shows : window.LRD_buildSchedule({ id: `s${id}`, genre: s.genre }),
      curated: !!c,
    };
    const m = (st.dial || '').match(/(\d+(?:\.\d+)?)/);
    st.frequency = m ? parseFloat(m[1]) : 0;
    st.isAM = /AM/i.test(st.dial || '');
    st.isDigital = !m;
    return st;
  }).filter(Boolean).sort((a, b) =>
    (a.isDigital - b.isDigital) || (a.isAM - b.isAM) || (a.frequency - b.frequency)
  );
}

function switchMarket(id) {
  state.marketId = id;
  state.stations = buildStations();
  const first = state.stations[0];
  if (first) {
    state.currentId = first.id;
    if (audio && first.stream) { audio.pause(); audio.src = first.stream; }
    state.playing = false;
  }
  state.filter = { chip: null, genre: null, location: null };
}

function visibleStations() {
  let list = state.stations;
  if (state.filter.chip === 'presets') list = list.filter((s) => state.favorites.has(s.id));
  if (state.filter.genre) list = list.filter((s) => s.genre === state.filter.genre);
  if (state.filter.location) list = list.filter((s) => s.location === state.filter.location);
  return list;
}

/* ---- audio ---- */
let audio;
function setStation(id, play) {
  const st = state.stations.find((s) => s.id === id);
  if (!st) return;
  state.currentId = id;
  state.liked = state.disliked = false;
  if (audio && st.stream) {
    audio.src = st.stream;
    if (play) { const p = audio.play(); if (p && p.catch) p.catch(() => {}); }
  }
  render();
}
function step(delta) {
  const list = visibleStations();
  if (!list.length) return;
  const i = list.findIndex((s) => s.id === state.currentId);
  const next = list[((i < 0 ? 0 : i) + delta + list.length) % list.length];
  setStation(next.id, true);
}
function flashError(msg) {
  const el = $('error');
  el.textContent = msg; el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 4000);
}

/* ---- render ---- */
const CHIPS = [
  { id: 'presets',  label: 'Presets' },
  { id: 'yours',    label: 'Your Stations' },
  { id: 'location', label: 'New York, NY', leading: 'assets/v2/chip-location.svg' },
  { id: 'genre',    label: 'All Genres',   trailing: 'assets/v2/chip-chevron.svg' },
];

function renderChips() {
  const host = $('chips');
  host.innerHTML = '';
  CHIPS.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'chip';
    const active = c.id === 'genre'    ? !!state.filter.genre
                 : c.id === 'location' ? false
                 : state.filter.chip === c.id;
    b.setAttribute('aria-pressed', String(active));
    const label = c.id === 'genre'    && state.filter.genre    ? state.filter.genre
                : c.id === 'location' ? (state.locationMethod === 'zip' && state.zip ? state.zip : currentMarket().label)
                : c.label;
    b.innerHTML =
      (c.leading ? `<img class="icon" src="${c.leading}" alt="">` : '') +
      `<span>${label}</span>` +
      (c.trailing ? `<img class="icon" src="${c.trailing}" alt="">` : '');
    b.addEventListener('click', () => onChip(c.id));
    host.appendChild(b);
  });
}

function onChip(id) {
  if (id === 'genre' || id === 'location') { openSheet(id); return; }
  state.filter.chip = state.filter.chip === id ? null : id;
  render();
}

/* ---- bottom sheet: genre and location pickers ---- */
const SHEETS = {
  genre: {
    title: 'Genre',
    allLabel: 'All Genres',
    valueOf: (s) => s.genre,
    get: () => state.filter.genre,
    set: (v) => { state.filter.genre = v; },
  },
};

/* The location sheet follows the iOS app rather than a flat city list.
 * iHeart/SharedUI/Headers/SectionHeaderDropdownPills/LocationSheet.swift offers
 * three selection METHODS, each a 64px row with a location-services icon that
 * is filled for the active method and unfilled for the others:
 *
 *   1. Use Current Location  (subtitle: the resolved location)
 *   2. Use Zip Code          (subtitle: the entered zip, when that is the method)
 *   3. Choose a City         (pushes LocationPickerView)
 *
 * Header title is "Update Location". On iOS the city picker is two wheel
 * pickers, country and city; a scrolling list is the web equivalent.
 */
// Stands in for CoreLocation. The prototype cannot detect a real location, so
// "Use Current Location" always resolves here, and it is also the market the
// app opens on.
const DETECTED_MARKET = { id: 159, label: 'New York, NY' };
const DETECTED_ZIPS = ['10001', '10002', '10003', '10011', '11201', '11211', '07030'];

function openSheet(kind) { state.sheet = kind; state.sheetPage = 'main'; renderSheet(); }
function closeSheet() { state.sheet = null; renderSheet(); }

function renderSheet() {
  const kind = state.sheet;
  const scrim = $('scrim'), sheet = $('sheet');
  if (!kind) { scrim.hidden = sheet.hidden = true; return; }
  scrim.hidden = sheet.hidden = false;
  if (kind === 'location') return renderLocationSheet();
  return renderValueSheet(kind);
}

/* A plain list of values with counts. Used by the genre sheet. */
function renderValueSheet(kind) {
  const cfg = SHEETS[kind];
  const counts = {};
  state.stations.forEach((s) => {
    const v = cfg.valueOf(s);
    if (v) counts[v] = (counts[v] || 0) + 1;
  });
  const values = Object.keys(counts).sort();
  const current = cfg.get();

  $('sheetTitle').textContent = cfg.title;
  $('sheetNote').hidden = true;
  $('sheetBack').hidden = true;

  const host = $('sheetOptions');
  host.innerHTML = '';
  [{ v: null, label: cfg.allLabel, count: null }]
    .concat(values.map((v) => ({ v, label: v, count: counts[v] })))
    .forEach((opt) => {
      const b = document.createElement('button');
      b.className = 'option';
      b.setAttribute('aria-selected', String(current === opt.v));
      b.innerHTML =
        `<span class="label"><span class="name">${opt.label}</span>` +
        (opt.count != null ? `<span class="count">(${opt.count})</span>` : '') + '</span>' +
        (current === opt.v ? '<img class="icon" src="assets/v2/check.svg" alt="">' : '');
      b.addEventListener('click', () => { cfg.set(opt.v); renderSheet(); render(); });
      host.appendChild(b);
    });
}

function renderLocationSheet() {
  const host = $('sheetOptions');
  host.innerHTML = '';
  const market = currentMarket();

  if (state.sheetPage === 'cities') {
    $('sheetTitle').textContent = 'Choose a City';
    $('sheetBack').hidden = false;
    $('sheetNote').hidden = true;

    // 251 markets is too many to scroll, so the list is filtered by a search
    // field. iOS uses two wheel pickers (country then city) for the same job.
    const search = document.createElement('input');
    search.className = 'city-search';
    search.type = 'search';
    search.placeholder = 'Search cities';
    search.value = state.citySearch;
    search.addEventListener('input', () => {
      state.citySearch = search.value;
      renderLocationSheet();
      const again = host.querySelector('.city-search');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
    host.appendChild(search);

    const q = state.citySearch.trim().toLowerCase();
    const matches = window.LRD_US.markets
      .filter((m) => !q || `${m[1]}, ${m[2]}`.toLowerCase().includes(q))
      .slice(0, 60);

    if (!matches.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No cities match "' + state.citySearch + '".';
      host.appendChild(p);
      return;
    }

    matches.forEach((m) => {
      const selected = m[0] === state.marketId;
      const b = document.createElement('button');
      b.className = 'option';
      b.setAttribute('aria-selected', String(selected));
      b.innerHTML = `<span class="label"><span class="name">${m[1]}, ${m[2]}</span>` +
        `<span class="count">(${m[3]})</span></span>` +
        (selected ? '<img class="icon" src="assets/v2/check.svg" alt="">' : '');
      b.addEventListener('click', () => {
        switchMarket(m[0]);
        state.locationMethod = 'picker';
        state.sheetPage = 'main';
        state.citySearch = '';
        renderSheet(); render();
      });
      host.appendChild(b);
    });
    return;
  }

  $('sheetTitle').textContent = 'Update Location';
  $('sheetBack').hidden = true;
  $('sheetNote').hidden = true;

  const rows = [
    { m: 'current', title: 'Use Current Location', sub: DETECTED_MARKET.label },
    { m: 'zip',     title: 'Use Zip Code',         sub: state.locationMethod === 'zip' ? state.zip : null },
    { m: 'picker',  title: 'Choose a City',        sub: state.locationMethod === 'picker' ? market.label : null },
  ];
  rows.forEach((r) => {
    const active = state.locationMethod === r.m;
    const b = document.createElement('button');
    b.className = 'loc-row';
    b.innerHTML =
      `<span class="text"><span class="t">${r.title}</span>` +
      (r.sub ? `<span class="s">${r.sub}</span>` : '') + '</span>' +
      `<img class="icon${active ? '' : ' dim'}" src="assets/v2/location-services${active ? '' : '-unfilled'}.svg" alt="">`;
    b.addEventListener('click', () => onLocationMethod(r.m));
    host.appendChild(b);
  });
}

function onLocationMethod(method) {
  if (method === 'picker') { state.sheetPage = 'cities'; renderSheet(); return; }
  if (method === 'zip') {
    const z = prompt('Enter a ZIP code');
    if (z == null) return;
    const trimmed = z.trim();
    // iOS gates Save on ZipCodeValidator and only commits inside the success
    // branch, so a well-formed but unresolvable code never displays as your
    // location. Same rule here. Resolving a ZIP to a market needs a lookup the
    // AMP station endpoints do not expose, so only the detected market's ZIPs
    // are accepted; wire a real geocode before this is more than a demo.
    if (!/^\d{5}$/.test(trimmed)) { flashError('Enter a 5 digit ZIP code'); return; }
    if (!DETECTED_ZIPS.includes(trimmed)) {
      flashError('No stations found for ' + trimmed);
      return;
    }
    switchMarket(DETECTED_MARKET.id);
    state.zip = trimmed;
  }
  if (method === 'current') switchMarket(DETECTED_MARKET.id);
  state.locationMethod = method;
  renderSheet(); render();
}

function renderGuide() {
  const host = $('guide');
  const list = visibleStations();
  host.innerHTML = '';
  if (!list.length) {
    host.innerHTML = '<p class="empty">No stations match these filters.</p>';
    return;
  }
  const hour = now().getHours();
  list.forEach((st) => {
    const show = showAt(st, hour);
    const el = document.createElement('div');
    el.className = 'station' + (st.id === state.currentId ? ' is-playing' : '');
    el.innerHTML = `
      <div class="logo"><img src="${st.logo}" alt="${st.name}"></div>
      <button class="row">
        <span class="metadata">
          <span class="show">${show ? show.title : st.name}</span>
          <span class="when">${show ? timeRange(show.start, show.end) : st.dial}</span>
        </span>
        <span class="more" role="button" aria-label="More options for ${st.name}">
          <img class="icon" src="assets/v2/row-overflow.svg" alt="">
        </span>
      </button>`;
    el.querySelector('.row').addEventListener('click', (e) => {
      if (e.target.closest('.more')) {
        e.stopPropagation();
        toggleFavorite(st.id);
        return;
      }
      setStation(st.id, true);
    });
    host.appendChild(el);
  });
}

function toggleFavorite(id) {
  state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
  try { localStorage.setItem('lrdV2Favorites', JSON.stringify([...state.favorites])); } catch (e) {}
  render();
}

function renderNowPlaying() {
  const st = state.stations.find((s) => s.id === state.currentId);
  if (!st) return;
  const show = showAt(st, now().getHours());
  $('npArt').src = st.logo;
  $('npArt').alt = st.name;
  // The Figma shows track-level metadata (song title, then artists). The dataset
  // is schedule-level, so this maps to show title then host and station. Wiring
  // a real now-playing track feed would fill the same two lines.
  $('npTitle').textContent = show ? show.title : st.name;
  $('npSubtitle').textContent = show && show.host ? `${show.host} • ${st.name}` : st.name;
  $('btnLike').setAttribute('aria-pressed', String(state.liked));
  $('btnDislike').setAttribute('aria-pressed', String(state.disliked));
}

function renderTransport() {
  const btn = $('btnStop');
  const playing = state.playing;
  btn.querySelector('img').src = playing ? 'assets/v2/stop.svg' : 'assets/v2/play.svg';
  btn.setAttribute('aria-label', playing ? 'Stop' : 'Play');
}

function render() {
  renderTransport();
  renderNowPlaying();
  renderChips();
  renderGuide();
}

/* ---- boot ---- */
(function init() {
  $('statusBar').hidden = !RESEARCH.showStatusBar;
  state.stations = buildStations();
  try {
    const saved = localStorage.getItem('lrdV2Favorites');
    if (saved) state.favorites = new Set(JSON.parse(saved));
  } catch (e) {}

  // data/stations.js names the home station by its own id; resolve via apiId so
  // it matches the market lineup.
  const homeCurated = (window.LRD_STATIONS || []).find((s) => s.id === window.LRD_HOME_STATION);
  const home = state.stations.find((s) => homeCurated && s.apiId === homeCurated.apiId)
            || state.stations[0];
  if (home) {
    state.currentId = home.id;
    if (!state.favorites.size) state.favorites.add(home.id);
  }

  audio = new Audio();
  audio.preload = 'none';
  // Both events must re-render: the button showed a stop glyph forever because
  // nothing repainted it when playback actually stopped.
  audio.addEventListener('playing', () => { state.playing = true;  renderTransport(); });
  audio.addEventListener('pause',   () => { state.playing = false; renderTransport(); });
  audio.addEventListener('error',   () => flashError('Unable to play this stream'));
  if (home && home.stream) audio.src = home.stream;

  $('btnStop').addEventListener('click', () => {
    if (state.playing) {
      audio.pause();
      // Live radio stops rather than pauses: drop the buffer so resuming
      // rejoins the stream live instead of replaying stale audio.
      audio.currentTime = 0;
    } else {
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
    }
  });
  $('scrim').addEventListener('click', closeSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetBack').addEventListener('click', () => { state.sheetPage = 'main'; renderSheet(); });
  $('sheetApply').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  $('btnPrev').addEventListener('click', () => step(-1));
  $('btnNext').addEventListener('click', () => step(1));
  $('btnLike').addEventListener('click', () => {
    state.liked = !state.liked; if (state.liked) state.disliked = false; render();
  });
  $('btnDislike').addEventListener('click', () => {
    state.disliked = !state.disliked; if (state.disliked) state.liked = false; render();
  });

  render();
})();
</script>
</body>
</html>

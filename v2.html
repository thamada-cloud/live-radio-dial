<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Radio Dial v2</title>
<script src="data/stations.js"></script>
<script src="data/stations-us.js"></script>
<script src="data/onair.js"></script>
<style>
  /* Design tokens, as named in the Figma file (Live-Radio-Dial-v2, node 314:13377) */
  :root{
    --surface-app:#f6f8f9;
    --surface-app-overlay:rgba(0,0,0,.7);
    --surface-shadow:rgba(0,0,0,.12);
    --on-surface-primary:#27292d;
    --on-surface-secondary:#3f4447;
    --on-surface-brand-monochrome:#000;
    --container-quaternary:#e6eaed;
    --container-primary-inverse:#fff;   /* trueWhite  */
    --on-surface-emphasis:#c6002b;      /* red600     */
    --tab-unselected:#3f4447;           /* grey500    */
    --hairline:#e6eaed;                 /* grey200    */
    --brand-red:#c6002b;
    --radius-primary:6px;
    --radius-circular:999px;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--surface-app);color:var(--on-surface-primary);
    font-family:var(--body);-webkit-font-smoothing:antialiased;
    min-height:100vh;overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;display:flex}
  img{display:block}
  .icon{display:block;width:100%;height:100%}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


  /* ---------- now playing ---------- */
  /* The frame put 88px of header above the artwork. With the header gone the
     art sat flush against the top edge, so keep a little room, plus the safe
     area on a notched device. */
  .page{padding:0 16px 96px}
  /* Artwork, metadata, thumbs and the filter chips hold position; only the
     station rows scroll under them. */
  .top-sticky{
    position:sticky;top:0;z-index:30;
    display:flex;flex-direction:column;gap:16px;
    background:var(--surface-app);
    padding:calc(16px + env(safe-area-inset-top)) 0 16px;
  }
  .now{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .art{
    width:248px;height:248px;border-radius:var(--radius-primary);overflow:hidden;
    filter:drop-shadow(0 1px 1.5px var(--surface-shadow));background:#fff;
  }
  .art img{width:100%;height:100%;object-fit:cover;background:#fff}
  .meta-row{display:flex;align-items:center;justify-content:space-between;width:100%}
  .copy{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
  .copy .title{
    font-size:16px;line-height:18px;font-weight:600;color:var(--on-surface-primary);
    white-space:nowrap;overflow:hidden;
  }
  .copy .subtitle{
    font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-secondary);
    white-space:nowrap;overflow:hidden;
  }
  /* 60px fade so long track/artist strings run out rather than hard-clip */
  .copy::after{
    content:"";position:absolute;top:0;bottom:0;right:0;width:60px;pointer-events:none;
    background:linear-gradient(to right,rgba(246,248,249,0) 45%,var(--surface-app) 95%);
  }
  .live-badge,.hero-meta,.hero-desc{display:none}
  .thumbs{display:flex;align-items:center;justify-content:flex-end;flex-shrink:0}
  .thumbs button{padding:4px;border-radius:var(--radius-circular)}
  .thumbs button:hover{background:rgba(0,0,0,.05)}
  .thumbs button[aria-pressed="true"]{background:rgba(39,41,45,.1)}
  .thumbs .icon{width:32px;height:32px}

  /* ---------- filter chips ---------- */
  .chips{
    display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    margin:8px -16px 0;padding:0 16px;
    /* Collapses out of the way on scroll down. max-height rather than transform
       so the space is actually reclaimed for rows, not just vacated. */
    max-height:56px;
    transition:max-height .25s ease,opacity .2s ease,margin-top .25s ease;
  }
  .chips.is-stowed{max-height:0;opacity:0;margin-top:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){ .chips{transition:none} }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;
    border:1px solid var(--on-surface-primary);border-radius:var(--radius-circular);
    padding:8px 16px;font-size:14px;line-height:16px;font-weight:600;
    color:var(--on-surface-primary);white-space:nowrap;
  }
  .chip .icon{width:16px;height:16px}
  .chip[aria-pressed="true"]{background:var(--on-surface-primary);color:#fff}
  .chip[aria-pressed="true"] .icon{filter:invert(1) brightness(2)}

  /* ---------- station guide (a list in v2, not a grid) ---------- */
  .guide{display:flex;flex-direction:column;gap:8px}
  .station{display:flex;gap:8px;align-items:center}
  .station .logo{
    width:48px;height:48px;flex-shrink:0;border-radius:var(--radius-primary);
    background:#fff;box-shadow:0 1px 3px 0 var(--surface-shadow);overflow:hidden;
  }
  .station .logo img{width:100%;height:100%;object-fit:cover}
  .station .row{
    flex:1;min-width:0;height:48px;min-height:44px;display:flex;align-items:center;gap:8px;
    background:var(--container-quaternary);border-radius:var(--radius-primary);
    padding:0 16px;border:2px solid transparent;text-align:left;
  }
  .station.is-playing .row{border-color:var(--brand-red)}
  .station .row .metadata{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
  /* Line one is the station name, line two its description. The on-air show and
     time live in the now-playing block above, not on every row. */
  .station .row .show{
    font-size:14px;line-height:16px;font-weight:600;color:var(--on-surface-secondary);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .station .row .when{
    font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-primary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .station .row .more{padding:4px;border-radius:var(--radius-circular);flex-shrink:0}
  .station .row .more .icon{width:24px;height:24px}
  .empty{padding:32px 0;text-align:center;color:var(--on-surface-secondary);font-size:14px}


  /* ---------- bottom tab bar ----------
     Built from the iOS app; the Figma file has no tab bar.
     Tabs and order:  iHeart/AppNavigation/TabBarConfigFiveTabs.json
     49pt height:     TabBarViewModel
     Appearance:      IHRAppDelegate configures UITabBarAppearance with
                      container_primary_inverse background,
                      on_surface_secondary unselected,
                      on_surface_emphasis selected.
     Those tokens resolve in Multiplatform/DesignTokens/ColorManager.swift. In
     LIGHT theme container_primary_inverse is trueWhite and on_surface_emphasis
     is red600, so the bar is white with a red selected tab. An earlier cut read
     "inverse" as dark and built a black bar, which is the dark-theme pairing. */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;align-items:stretch;
    height:calc(49px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--container-primary-inverse);
    border-top:1px solid var(--hairline);
  }
  .tabbar button{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:6px 2px 4px;color:var(--tab-unselected);
  }
  .tabbar button[aria-current="page"]{color:var(--on-surface-emphasis)}
  /* Inlined, not <img>: an SVG loaded through <img> cannot inherit the page's
     color, so currentColor resolved to black and the icons vanished. */
  .tabbar svg{width:24px;height:24px;display:block;fill:currentColor}
  .tabbar .label{
    font-size:10px;line-height:12px;font-weight:500;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }



  /* ---------- wide screens: the now-playing hero ----------
     On a phone the now-playing block is compact: art, one line of copy, thumbs.
     Given width it becomes a hero, with the copy set large on the left and the
     artwork on the right, and room for things the phone has no space for: a
     live badge, how long is left in the show, and the station's description.
     The station list below is unchanged. */
  @media (min-width: 1024px){
    .page{max-width:1240px;margin:0 auto;padding:32px 24px 96px}
    /* The phone gets this gap from .top-sticky's bottom padding. Setting
       padding:0 here removed it and the chips sat flush against the first row,
       since .page is display:block and has no gap to fall back on. */
    .top-sticky{position:static;padding:0 0 24px;gap:24px}

    /* 320 rather than 360: the copy column runs to ~300px, so a taller image
       left ~57px of dead space under the thumbs once centring took effect. */
    .now{flex-direction:row;align-items:center;gap:40px}
    .now .art{order:2;width:320px;height:320px;flex-shrink:0}
    .meta-row{order:1;flex:1;min-width:0;flex-direction:column;align-items:flex-start;gap:20px}
    .copy{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:0}
    /* The phone clips this to one line with a fade; here it can breathe. */
    .copy::after{display:none}
    .copy .title{font-size:44px;line-height:50px;font-weight:700;white-space:normal;overflow:visible}
    .copy .subtitle{font-size:16px;line-height:22px;margin-top:8px;white-space:normal;overflow:visible}

    .live-badge{
      display:inline-block;margin-bottom:12px;padding:4px 10px;border-radius:4px;
      background:var(--brand-red);color:#fff;
      font-size:12px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    }
    .hero-meta{
      display:flex;align-items:center;gap:8px;margin-top:12px;
      font-size:14px;line-height:20px;color:var(--on-surface-secondary);
    }
    .hero-meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
    .hero-meta .pill{
      border:1px solid var(--on-surface-secondary);border-radius:3px;
      padding:0 6px;font-size:12px;line-height:18px;font-weight:600;
    }
    .hero-desc{
      display:block;margin-top:16px;max-width:60ch;
      font-size:15px;line-height:22px;color:var(--on-surface-secondary);
    }
    .thumbs{align-self:flex-start}
    .chips{margin:0;padding:0;flex-wrap:wrap}
    .guide{gap:8px}
  }

  /* Two columns of rows once there is room, so a wide window does not leave a
     single column of 48px rows stranded in the middle. */
  @media (min-width: 1280px){
    .guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
  }

  .error{
    position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--brand-red);color:#fff;padding:12px 16px;border-radius:8px;
    font-size:14px;font-weight:500;box-shadow:0 10px 15px rgba(0,0,0,.2);max-width:calc(100% - 32px);
  }

  /* ---------- bottom sheet (matches the v1 filter sheet pattern) ---------- */
  @keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4)}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:101;display:flex;flex-direction:column;
    background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);
    max-height:80vh;animation:sheet-up .3s ease-out;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet .grabber{display:flex;justify-content:center;padding:12px 0 8px}
  .sheet .grabber i{width:40px;height:4px;border-radius:999px;background:#d1d5db;display:block}
  .sheet header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 24px 16px;border-bottom:1px solid #e5e7eb;
  }
  .sheet header h2{font-size:20px;line-height:24px;font-weight:600;color:var(--on-surface-primary)}
  .sheet header button{padding:8px;border-radius:var(--radius-circular)}
  .sheet header button:hover{background:#f3f4f6}
  .sheet header .icon{width:20px;height:20px}
  .sheet .options{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:4px}
  .sheet .option{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 16px;border-radius:8px;background:transparent;text-align:left;
  }
  .sheet .option:hover{background:#f3f4f6}
  .sheet .option .label{display:flex;align-items:center;gap:8px;min-width:0}
  .sheet .option .name{font-weight:500;color:var(--on-surface-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .option .count{font-size:14px;color:#6b7280;flex-shrink:0}
  .sheet .option .icon{width:20px;height:20px;flex-shrink:0}
  .sheet .option[aria-selected="true"]{background:rgba(198,0,43,.1)}
  .sheet .option[aria-selected="true"] .name{color:var(--brand-red)}
  .sheet .option[aria-selected="true"] .icon{filter:invert(16%) sepia(96%) saturate(5000%) hue-rotate(338deg) brightness(85%) contrast(105%)}
  .sheet footer{padding:16px 24px;border-top:1px solid #e5e7eb;background:#f9fafb}
  .sheet footer button{
    width:100%;justify-content:center;background:var(--brand-red);color:#fff;
    padding:12px;border-radius:8px;font-weight:500;
  }
  .sheet footer button:hover{background:#a00023}
  /* Location sheet rows, per iOS HeaderSheetStyle:
     locationRowCellHeight 64, locationRowEdgeInsets 4, icon 20,
     title = body3, subtitle = caption1 in grey400. */
  .sheet .loc-row{
    width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:0 4px;background:transparent;text-align:left;
  }
  .sheet .loc-row:hover{background:#f3f4f6;border-radius:8px}
  .sheet .loc-row .text{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sheet .loc-row .t{font-size:16px;line-height:20px;color:var(--on-surface-primary)}
  .sheet .loc-row .s{font-size:12px;line-height:16px;letter-spacing:-.35px;color:#9ca3af;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .loc-row .icon{width:20px;height:20px;flex-shrink:0;color:var(--on-surface-primary)}
  .sheet .loc-row .icon.dim{opacity:.35}
  .sheet .back{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 0;border-radius:8px}
  .sheet .back .icon{width:20px;height:20px}
  .sheet .city-search{
    width:100%;margin-bottom:8px;padding:10px 12px;font:inherit;font-size:16px;
    border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--on-surface-primary);
  }
  .sheet .city-search:focus{outline:2px solid var(--brand-red);outline-offset:-1px}
  .sheet .action-row{
    width:100%;display:flex;align-items:center;gap:16px;
    padding:14px 8px;border-radius:8px;background:transparent;text-align:left;
  }
  .sheet .action-row:hover{background:#f3f4f6}
  .sheet .action-row .icon{width:24px;height:24px;flex-shrink:0;color:var(--on-surface-primary)}
  .sheet .action-row .name{font-size:16px;line-height:22px;font-weight:500;color:var(--on-surface-primary)}
  .sheet .note{padding:0 24px 16px;font-size:13px;line-height:18px;color:#6b7280}
  [hidden]{display:none !important}
</style>
</head>
<body>

<main class="page">
  <div class="top-sticky">
  <section class="now">
    <div class="art"><img id="npArt" src="" alt=""></div>
    <div class="meta-row">
      <div class="copy">
        <span class="live-badge" id="npBadge">Live</span>
        <div class="title" id="npTitle"></div>
        <div class="subtitle" id="npSubtitle"></div>
        <div class="hero-meta" id="npMeta"></div>
        <p class="hero-desc" id="npDesc"></p>
      </div>
      <div class="thumbs">
        <button id="btnDislike" aria-label="Dislike" aria-pressed="false">
          <img class="icon" src="assets/v2/thumb-down.svg" alt="">
        </button>
        <button id="btnLike" aria-label="Like" aria-pressed="false">
          <img class="icon" src="assets/v2/thumb-up.svg" alt="">
        </button>
      </div>
    </div>
  </section>

  <nav class="chips" id="chips" aria-label="Filters"></nav>
  </div>

  <section class="guide" id="guide"></section>
</main>


<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber"><i></i></div>
  <header style="gap:8px">
    <button class="back" id="sheetBack" aria-label="Back" hidden><img class="icon" src="assets/v2/sheet-back.svg" alt=""></button>
    <h2 id="sheetTitle"></h2>
    <button id="sheetClose" aria-label="Close"><img class="icon" src="assets/v2/close.svg" alt=""></button>
  </header>
  <div class="options" id="sheetOptions"></div>
  <p class="note" id="sheetNote" hidden></p>
  <footer id="sheetFooter"><button id="sheetApply">Apply</button></footer>
</section>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div class="error" id="error" hidden></div>

<script>
/* ============================================================================
 * Live Radio Dial v2
 * Built from Figma: Live-Radio-Dial-v2, node 314:13377
 *
 * v2 is a different information architecture from v1, not a restyle. The
 * two-axis EPG grid is gone: there is no time axis and no horizontal scroll.
 * Each station is one row showing what is on right now plus its time range,
 * and the filter icon and bottom sheet are replaced by a scrolling chip row.
 *
 * Deliberately vanilla: v1 runs on the Claude Design x-dc runtime, and keeping
 * v2 independent means neither version can break the other. Both read the same
 * data/stations.js so the lineup and schedules stay in one place.
 * ========================================================================== */

const RESEARCH = {
  // Matches v1 so the two versions are comparable in a study. See v1's
  // Component.RESEARCH for why the clock is pinned rather than live.
  pinnedNow: [9, 20],
  // Pulls the actual song on air from iHeart's live-meta API. Real and live,
  // which is the point, but it means the hero is not identical between two
  // people looking at once. Set false for a study build, where every
  // participant must see the same screen; the hero then falls back to the
  // show and station, which are fixed.
  liveTrackData: true,
};

const state = {
  stations: [],
  currentId: null,
  playing: false,
  favorites: new Set(),
  liked: false,
  disliked: false,
  track: null,
  library: new Set(),
  rowStation: null,
  filter: { chip: null, genre: null, location: null },
  sheet: null,
  sheetPage: 'main',
  marketId: 159,            // New York, the default lineup
  citySearch: '',
  locationMethod: 'current',
  zip: '',
};

const $ = (id) => document.getElementById(id);
const now = () => {
  const d = new Date();
  if (RESEARCH.pinnedNow) d.setHours(RESEARCH.pinnedNow[0], RESEARCH.pinnedNow[1], 0, 0);
  return d;
};

/* ---- time formatting: "7:00 - 8:00 AM", "10:00 AM - 2:00 PM" ---- */
const h12 = (h) => { const x = Math.floor(h) % 12; return x === 0 ? 12 : x; };
const mins = (h) => Math.round((h - Math.floor(h)) * 60);
const mer = (h) => (Math.floor(h) % 24) < 12 ? 'AM' : 'PM';
const clock = (h) => `${h12(h)}:${String(mins(h)).padStart(2, '0')}`;
function timeRange(start, end) {
  return mer(start) === mer(end)
    ? `${clock(start)} - ${clock(end)} ${mer(end)}`
    : `${clock(start)} ${mer(start)} - ${clock(end)} ${mer(end)}`;
}
// Blocks can wrap past midnight (22:00-02:00), so a plain start<=h<end test
// misses the late-night show.
function showAt(station, hour) {
  return (station.shows || []).find((s) =>
    s.start <= s.end ? (hour >= s.start && hour < s.end)
                     : (hour >= s.start || hour < s.end)
  ) || null;
}

/* ---- data ---- */
function currentMarket() {
  const m = window.LRD_US.markets.find((x) => x[0] === state.marketId);
  return m ? { id: m[0], city: m[1], state: m[2], count: m[3], label: `${m[1]}, ${m[2]}` }
           : { id: state.marketId, city: '', state: '', count: 0, label: '' };
}

function buildStations() {
  const ids = window.LRD_US.lineups[state.marketId] || [];
  const label = currentMarket().label;

  return ids.map((id) => {
    const s = window.LRD_US.stations[id];
    if (!s) return null;
    const st = {
      id: `s${id}`, apiId: id, name: s.name, dial: s.dial, callLetters: s.call,
      genre: s.genre, description: s.desc, logo: s.logo, stream: s.stream,
      location: label,
      // Real schedule if the station publishes one, otherwise none. Nothing is
      // generated: a made-up show name on a real station reads as a bug.
      shows: (window.LRD_ONAIR[id] || []).map(([start, end, title]) => ({ start, end, title })),
    };
    const m = (st.dial || '').match(/(\d+(?:\.\d+)?)/);
    st.frequency = m ? parseFloat(m[1]) : 0;
    st.isAM = /AM/i.test(st.dial || '');
    st.isDigital = !m;
    return st;
  }).filter(Boolean).sort((a, b) =>
    (a.isDigital - b.isDigital) || (a.isAM - b.isAM) || (a.frequency - b.frequency)
  );
}

function switchMarket(id) {
  state.marketId = id;
  state.stations = buildStations();
  const first = state.stations[0];
  if (first) {
    state.currentId = first.id;
    state.track = null;
    loadTrack(first.id);
    if (audio && first.stream) { audio.pause(); audio.src = first.stream; }
    state.playing = false;
  }
  state.filter = { chip: null, genre: null, location: null };
}

function visibleStations() {
  let list = state.stations;
  if (state.filter.chip === 'presets') list = list.filter((s) => state.favorites.has(s.id));
  if (state.filter.genre) list = list.filter((s) => s.genre === state.filter.genre);
  if (state.filter.location) list = list.filter((s) => s.location === state.filter.location);
  return list;
}

/* ---- now playing track ----
 * https://us.api.iheart.com/api/v3/live-meta/stream/<id>/trackHistory?limit=1
 * is the same live-meta service the iOS app reads (LiveMetadataEndpoint). It
 * serves Access-Control-Allow-Origin: *, so the browser can call it directly.
 * Talk, news and sports stations have no track feed and return nothing, which
 * is the expected case rather than a failure.
 */
let trackTimer;

async function loadTrack(stationId) {
  if (!RESEARCH.liveTrackData) return;
  const st = state.stations.find((s) => s.id === stationId);
  if (!st) return;
  try {
    const r = await fetch(`https://us.api.iheart.com/api/v3/live-meta/stream/${st.apiId}/trackHistory?limit=1`);
    if (!r.ok) throw new Error(String(r.status));
    const t = (await r.json()).data?.[0];
    // The station may have changed while this was in flight.
    if (state.currentId !== stationId) return;
    state.track = t && t.title ? {
      title: t.title,
      artist: t.artist || '',
      // The API hands back http, which a https page blocks as mixed content.
      art: t.imagePath ? t.imagePath.replace(/^http:/, 'https:') : null,
    } : null;
  } catch (e) {
    if (state.currentId === stationId) state.track = null;
  }
  renderNowPlaying();
}

function watchTrack() {
  clearInterval(trackTimer);
  if (!RESEARCH.liveTrackData) return;
  trackTimer = setInterval(() => loadTrack(state.currentId), 30000);
}

/* ---- audio ---- */
let audio;
function setStation(id, play) {
  const st = state.stations.find((s) => s.id === id);
  if (!st) return;
  state.currentId = id;
  state.liked = state.disliked = false;
  state.track = null;          // drop the old station's track immediately
  loadTrack(id);
  if (audio && st.stream) {
    audio.src = st.stream;
    if (play) { const p = audio.play(); if (p && p.catch) p.catch(() => {}); }
  }
  render();
}
function flashError(msg) {
  const el = $('error');
  el.textContent = msg; el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 4000);
}

function renderChips() {
  const host = $('chips');

    const active = c.id === 'genre'    ? !!state.filter.genre
                 : c.id === 'location' ? false

/* ---- bottom sheet: genre and location pickers ---- */
const SHEETS = {
  genre: {
    title: 'Genre',
    allLabel: 'All Genres',

/* The location sheet follows the iOS app rather than a flat city list.
 * iHeart/SharedUI/Headers/SectionHeaderDropdownPills/LocationSheet.swift offers
 * three selection METHODS, each a 64px row with a location-services icon that
 * is filled for the active method and unfilled for the others:
 *
 *   1. Use Current Location  (subtitle: the resolved location)
 *   2. Use Zip Code          (subtitle: the entered zip, when that is the method)
 *   3. Choose a City         (pushes LocationPickerView)
 *
 * Header title is "Update Location". On iOS the city picker is two wheel
 * pickers, country and city; a scrolling list is the web equivalent.
 */
// Stands in for CoreLocation. The prototype cannot detect a real location, so
// "Use Current Location" always resolves here, and it is also the market the
// app opens on.
const DETECTED_MARKET = { id: 159, label: 'New York, NY' };
const DETECTED_ZIPS = ['10001', '10002', '10003', '10011', '11201', '11211', '07030'];

function openSheet(kind) { state.sheet = kind; state.sheetPage = 'main'; renderSheet(); }
function closeSheet() { state.sheet = null; renderSheet(); }

function renderSheet() {
  const kind = state.sheet;
  const scrim = $('scrim'), sheet = $('sheet');
  if (!kind) { scrim.hidden = sheet.hidden = true; return; }
  scrim.hidden = sheet.hidden = false;
  $('sheetFooter').hidden = (kind === 'row');
  if (kind === 'row') return renderRowSheet();
  if (kind === 'location') return renderLocationSheet();
  return renderValueSheet(kind);
}

/* A plain list of values with counts. Used by the genre sheet. */
function renderValueSheet(kind) {
  const cfg = SHEETS[kind];
  const counts = {};
  state.stations.forEach((s) => {
    const v = cfg.valueOf(s);
    if (v) counts[v] = (counts[v] || 0) + 1;
  });
  const values = Object.keys(counts).sort();
  const current = cfg.get();

  $('sheetTitle').textContent = cfg.title;
  $('sheetNote').hidden = true;
  $('sheetBack').hidden = true;

  const host = $('sheetOptions');
  host.innerHTML = '';
  [{ v: null, label: cfg.allLabel, count: null }]
    .concat(values.map((v) => ({ v, label: v, count: counts[v] })))
    .forEach((opt) => {
      const b = document.createElement('button');
      b.className = 'option';
      b.setAttribute('aria-selected', String(current === opt.v));
      b.innerHTML =
        `<span class="label"><span class="name">${opt.label}</span>` +
        (opt.count != null ? `<span class="count">(${opt.count})</span>` : '') + '</span>' +
        (current === opt.v ? '<img class="icon" src="assets/v2/check.svg" alt="">' : '');
      b.addEventListener('click', () => { cfg.set(opt.v); renderSheet(); render(); });
      host.appendChild(b);
    });
}


/* ---- row overflow sheet ----
 * Options and their toggling behaviour follow the iOS app's radio overflow menu
 * (iHeart/SharedUI/Menu/View/OverflowMenu+Radio.swift): Presets and Library
 * each flip their label and icon depending on whether the station is already
 * saved. Icons are the real BottomSheet.xcassets glyphs.
 *
 * "Go to Station" is not an iOS MenuOption — the app has no goToStation case —
 * but it is in v1's media sheet and was asked for here, so it uses the dial
 * button icon.
 */
function renderRowSheet() {
  const st = state.stations.find((s) => s.id === state.rowStation);
  if (!st) return closeSheet();

  const inPresets = state.favorites.has(st.id);
  const inLibrary = state.library.has(st.id);

  const items = [
    { icon: inPresets ? 'delete-dash-circle' : 'add-to-preset',
      label: inPresets ? 'Remove from Presets' : 'Add to Preset',
      run: () => { toggleFavorite(st.id); renderSheet(); } },
    { icon: inLibrary ? 'remove-from' : 'add-to',
      label: inLibrary ? 'Remove from Library' : 'Add to Library',
      run: () => { toggleLibrary(st.id); renderSheet(); } },
    { icon: 'go-to-station', label: 'Go to Station',
      run: () => { closeSheet(); flashError(`${st.name} has no station page in this prototype`); } },
    { icon: 'share', label: 'Share',
      run: () => shareStation(st) },
  ];

  $('sheetTitle').textContent = st.name;
  $('sheetBack').hidden = true;
  $('sheetNote').hidden = true;

  const host = $('sheetOptions');
  host.innerHTML = '';
  items.forEach((it) => {
    const b = document.createElement('button');
    b.className = 'action-row';
    b.innerHTML = `<img class="icon" src="assets/sheet/${it.icon}.svg" alt="">` +
                  `<span class="name">${it.label}</span>`;
    b.addEventListener('click', it.run);
    host.appendChild(b);
  });
}

function toggleLibrary(id) {
  state.library.has(id) ? state.library.delete(id) : state.library.add(id);
  try { localStorage.setItem('lrdV2Library', JSON.stringify([...state.library])); } catch (e) {}
}

async function shareStation(st) {
  const url = location.href;
  const text = `${st.name} — ${st.description || st.genre}`;
  try {
    if (navigator.share) { await navigator.share({ title: st.name, text, url }); closeSheet(); return; }
    await navigator.clipboard.writeText(`${text} ${url}`);
    closeSheet(); flashError('Link copied');
  } catch (e) {
    closeSheet();   // the user dismissed the share sheet, which is not an error
  }
}

function renderLocationSheet() {
  const host = $('sheetOptions');
  host.innerHTML = '';
  const market = currentMarket();

  if (state.sheetPage === 'cities') {
    $('sheetTitle').textContent = 'Choose a City';
    $('sheetBack').hidden = false;
    $('sheetNote').hidden = true;

    // 251 markets is too many to scroll, so the list is filtered by a search
    // field. iOS uses two wheel pickers (country then city) for the same job.
    const search = document.createElement('input');
    search.className = 'city-search';
    search.type = 'search';
    search.placeholder = 'Search cities';
    search.value = state.citySearch;
    search.addEventListener('input', () => {
      state.citySearch = search.value;
      renderLocationSheet();
      const again = host.querySelector('.city-search');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
    host.appendChild(search);

    const q = state.citySearch.trim().toLowerCase();
    const matches = window.LRD_US.markets
      .filter((m) => !q || `${m[1]}, ${m[2]}`.toLowerCase().includes(q))
      .slice(0, 60);

    if (!matches.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No cities match "' + state.citySearch + '".';
      host.appendChild(p);
      return;
    }

    matches.forEach((m) => {
      const selected = m[0] === state.marketId;
      const b = document.createElement('button');
      b.className = 'option';
      b.setAttribute('aria-selected', String(selected));
      b.innerHTML = `<span class="label"><span class="name">${m[1]}, ${m[2]}</span>` +
        `<span class="count">(${m[3]})</span></span>` +
        (selected ? '<img class="icon" src="assets/v2/check.svg" alt="">' : '');
      b.addEventListener('click', () => {
        switchMarket(m[0]);
        state.locationMethod = 'picker';
        state.sheetPage = 'main';
        state.citySearch = '';
        renderSheet(); render();
      });
      host.appendChild(b);
    });
    return;
  }

  $('sheetTitle').textContent = 'Update Location';
  $('sheetBack').hidden = true;
  $('sheetNote').hidden = true;

  const rows = [
    { m: 'current', title: 'Use Current Location', sub: DETECTED_MARKET.label },
    { m: 'zip',     title: 'Use Zip Code',         sub: state.locationMethod === 'zip' ? state.zip : null },
    { m: 'picker',  title: 'Choose a City',        sub: state.locationMethod === 'picker' ? market.label : null },
  ];
  rows.forEach((r) => {
    const active = state.locationMethod === r.m;
    const b = document.createElement('button');
    b.className = 'loc-row';
    b.innerHTML =
      `<span class="text"><span class="t">${r.title}</span>` +
      (r.sub ? `<span class="s">${r.sub}</span>` : '') + '</span>' +
      `<img class="icon${active ? '' : ' dim'}" src="assets/v2/location-services${active ? '' : '-unfilled'}.svg" alt="">`;
    b.addEventListener('click', () => onLocationMethod(r.m));
    host.appendChild(b);
  });
}

function onLocationMethod(method) {
  if (method === 'picker') { state.sheetPage = 'cities'; renderSheet(); return; }
  if (method === 'zip') {
    const z = prompt('Enter a ZIP code');
    if (z == null) return;
    const trimmed = z.trim();
    // iOS gates Save on ZipCodeValidator and only commits inside the success
    // branch, so a well-formed but unresolvable code never displays as your
    // location. Same rule here. Resolving a ZIP to a market needs a lookup the
    // AMP station endpoints do not expose, so only the detected market's ZIPs
    // are accepted; wire a real geocode before this is more than a demo.
    if (!/^\d{5}$/.test(trimmed)) { flashError('Enter a 5 digit ZIP code'); return; }
    if (!DETECTED_ZIPS.includes(trimmed)) {
      flashError('No stations found for ' + trimmed);
      return;
    }
    switchMarket(DETECTED_MARKET.id);
    state.zip = trimmed;
  }
  if (method === 'current') switchMarket(DETECTED_MARKET.id);
  state.locationMethod = method;
  renderSheet(); render();
}

function renderNowPlaying() {
  const st = state.stations.find((s) => s.id === state.currentId);
  if (!st) return;
  const h = nowHours();
  const show = showAt(st, h);
  const track = state.track;

  // A song on air is the most specific thing to lead with, so it takes the
  // headline and the artwork. The show and station move to the line beneath,
  // which is how the Figma hero was drawn. Talk and news stations have no track
  // feed, so they fall back to the show, then to the station name.
  $('npArt').src = track && track.art ? track.art : st.logo;
  $('npArt').alt = track ? `${track.title} artwork` : st.name;
  $('npTitle').textContent = track ? track.title : (show ? show.title : st.name);
  $('npSubtitle').textContent =
    track  ? [track.artist, st.name].filter(Boolean).join(' • ')
  : show   ? st.name
  :          (st.description || st.genre);

  // Wide-screen only.
  const bits = [];
  if (track && show) bits.push(`<span>${show.title}</span>`);
  const left = show ? remainingIn(show, h) : null;
  if (left) { if (bits.length) bits.push('<span class="sep"></span>'); bits.push(`<span>${left} left</span>`); }
  if (st.dial)  { if (bits.length) bits.push('<span class="sep"></span>'); bits.push(`<span>${st.dial}</span>`); }
  if (st.genre) { if (bits.length) bits.push('<span class="sep"></span>'); bits.push(`<span class="pill">${st.genre}</span>`); }
  $('npMeta').innerHTML = bits.join('');
  $('npDesc').textContent = st.description || '';

  $('btnLike').setAttribute('aria-pressed', String(state.liked));
  $('btnDislike').setAttribute('aria-pressed', String(state.disliked));
}

// Decimal hour of the (pinned) clock.
function nowHours() {
  const d = now();
  return d.getHours() + d.getMinutes() / 60;
}

// "1h 40m", "40m". Handles a block that runs past midnight.
function remainingIn(show, h) {
  let end = show.end;
  if (end <= show.start && h >= show.start) end += 24;   // wraps past midnight
  const mins = Math.round((end - h) * 60);
  if (mins <= 0 || mins > 24 * 60) return null;
  const hrs = Math.floor(mins / 60), rem = mins % 60;
  return hrs ? (rem ? `${hrs}h ${rem}m` : `${hrs}h`) : `${rem}m`;
}



/* ---- stow the filter chips while scrolling down ----
 * The sticky block is tall on a phone, so the chips get out of the way as you
 * head down the list and come back the moment you scroll up. Only below 1024px:
 * the wide layout does not pin its header, so there is nothing to reclaim.
 */
function watchScroll() {
  const chips = $('chips');
  let last = window.scrollY;

  // Deliberately not rAF-throttled. An earlier version set a `ticking` flag and
  // cleared it inside requestAnimationFrame; when frames are throttled — a
  // backgrounded tab, low power mode, a busy renderer — the flag latched true
  // and every later scroll was dropped, so the chips could stay stowed while
  // scrolling up. Measured at 1-2 frames per second in testing. The work here
  // is two classList calls, so running it per scroll event is cheaper than the
  // bookkeeping was.
  addEventListener('scroll', () => {
    const y = Math.max(0, window.scrollY);
    const delta = y - last;
    last = y;

    // Never stow near the top: there is nothing to reclaim and it just flickers.
    if (y <= 120) { chips.classList.remove('is-stowed'); return; }
    // The wide layout does not pin its header, so there is nothing to gain.
    if (matchMedia('(min-width: 1024px)').matches) return;
    if (Math.abs(delta) <= 6) return;                 // ignore jitter

    chips.classList.toggle('is-stowed', delta > 0);
  }, { passive: true });

  // A resize can change which layout is active; start from a known state.
  addEventListener('resize', () => chips.classList.remove('is-stowed'));
}

function renderTabBar() {
  const host = $('tabbar');
  host.innerHTML = '';
  TABS.forEach((t) => {
    const b = document.createElement('button');
    const active = t.id === ACTIVE_TAB;
    if (active) b.setAttribute('aria-current', 'page');
    b.setAttribute('aria-label', t.label);
    b.innerHTML = TAB_ICONS[t.id] + `<span class="label">${t.label}</span>`;
    // Only Radio has a screen in this prototype.
    if (!active) b.addEventListener('click', () => flashError(`${t.label} is not built in this prototype`));
    host.appendChild(b);
  });
}

function render() {
  renderNowPlaying();
  renderChips();
  renderGuide();
}

/* ---- boot ---- */
(function init() {
  state.stations = buildStations();
  try {
    const saved = localStorage.getItem('lrdV2Favorites');
    if (saved) state.favorites = new Set(JSON.parse(saved));
    const lib = localStorage.getItem('lrdV2Library');
    if (lib) state.library = new Set(JSON.parse(lib));
  } catch (e) {}

  // data/stations.js names the home station by its own id; resolve via apiId so
  // it matches the market lineup.
  const homeCurated = (window.LRD_STATIONS || []).find((s) => s.id === window.LRD_HOME_STATION);
  const home = state.stations.find((s) => homeCurated && s.apiId === homeCurated.apiId)
            || state.stations[0];
  if (home) {
    state.currentId = home.id;
    if (!state.favorites.size) state.favorites.add(home.id);
    loadTrack(home.id);   // the boot path had no fetch; only setStation did
  }

  audio = new Audio();
  audio.preload = 'none';
  audio.addEventListener('playing', () => { state.playing = true; });
  audio.addEventListener('pause',   () => { state.playing = false; });
  audio.addEventListener('error',   () => flashError('Unable to play this stream'));
  if (home && home.stream) audio.src = home.stream;

  $('scrim').addEventListener('click', closeSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetBack').addEventListener('click', () => { state.sheetPage = 'main'; renderSheet(); });
  $('sheetApply').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  $('btnLike').addEventListener('click', () => {
    state.liked = !state.liked; if (state.liked) state.disliked = false; render();
  });
  $('btnDislike').addEventListener('click', () => {
    state.disliked = !state.disliked; if (state.disliked) state.liked = false; render();
  });

  renderTabBar();
  watchTrack();
  watchScroll();
  render();
})();
</script>

/* Fetches the four ranked sections once, then repaints Home. Each one fails on
 * its own: a section whose endpoint is down keeps its grey placeholder rather
 * than taking the rest of the page with it. */
function loadHomeData() {
  if (state.home.loading || state.home.loaded) return;
  state.home.loading = true;
  const jobs = [
    ['trending', fetchTrending],
    ['podcasts', fetchTopPodcasts],
    ['playlists', fetchTopPlaylists],
    ['artists', fetchTopArtists],
  ];
  Promise.all(jobs.map(([key, fn]) =>
    fn().then((v) => { state.home[key] = v; }).catch(() => {})
  )).then(() => {
    state.home.loading = false;
    state.home.loaded = true;
    if (state.view === 'home') renderHome();
  });
}

/* Search mirrors iHeart/Search: a bar, then recent searches and a Browse All
 * directory while idle, and results once you type. */

/* ---------- Home data, from the same endpoints iheart.com's home route uses ----------
 * Read off apps/listen/app/routes/_app/_index/.server/loader.ts in the web
 * monorepo, which prefetches exactly these four. Every one of them answers
 * unauthenticated, so the prototype can call them straight from the browser.
 *
 *   Trending on iHeart  webapi GraphQL `Trending`, pubsub type content:trending
 *   Top Podcasts        webapi GraphQL `Leads`, collections/popular-podcasts
 *   Top Playlists       webapi GraphQL `PlaylistsDirectoriesItems`,
 *                       collections/playlist-directory + facets/featured-playlists
 *   Top Artist Radio    AMP /api/v2/recs/genre, template CR, the web app's
 *                       DEFAULT_ARTIST_GENRE of 102
 *
 * Artist art comes back as an http:// image.iheart.com path, which a page served
 * over https will not load, so artists and podcasts both go through the
 * i.iheart.com catalog route by id instead. */
const WEBAPI = 'https://webapi.radioedit.iheart.com/graphql';
const AMP = 'https://us.api.iheart.com';
const HOME_COUNTRY = 'US';
const HOME_LOCALE = 'en-US';
const DEFAULT_ARTIST_GENRE = 102;   // rankers-top-artists.ts

async function gql(query, variables) {
  const r = await fetch(WEBAPI, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ query, variables }),
  });
  if (!r.ok) throw new Error(`webapi ${r.status}`);
  const j = await r.json();
  if (j.errors && j.errors.length) throw new Error(j.errors[0].message);
  return j.data;
}

const Q_TRENDING = `query Trending($mode: PubsubQueryMode, $subscription: [PubsubDistributionInput!]!) {
  pubsub { query(type: "content:trending", query: {limit: 1, mode: $mode, subscription: $subscription}) {
    items { content { __typename ... on PubsubContentTrendingPayloadSelection {
      data { trending { image { public_uri } title link mobile_link } } } } } } } }`;

const Q_LEADS = `fragment commonCardFields on Card {
  catalog { id } id img_uri link { urls { web device } } subtitle title }
  query Leads($query: QueryInput!, $locale: String) { leads(query: $query, locale: $locale) { ...commonCardFields } }`;

const Q_PLAYLISTS = `query PlaylistsDirectoriesItems($tags: [String!]!, $countries: [String!]!) {
  playlists { directories { list(args: {countries: $countries, tags: $tags, tagMatchType: EXACT, take: 10}) {
    items { id metadata { title subtitle imageUrl locales }
      children { id resource { ... on PlaylistsPlaylistRecord {
        title description urlImage publishedUserId publishedPlaylistId } } } } } } } }`;

async function fetchTrending() {
  const d = await gql(Q_TRENDING, {
    mode: 'MATCH_ANY',
    subscription: [{ tags: [`countries/${HOME_COUNTRY}`] }],
  });
  const items = d?.pubsub?.query?.items ?? [];
  const list = items[0]?.content?.data?.trending ?? [];
  return list.map((t) => ({ title: t.title, art: t.image?.public_uri || '' }));
}

async function fetchTopPodcasts() {
  const d = await gql(Q_LEADS, {
    locale: HOME_LOCALE,
    query: { subscription: [{ tags: ['collections/popular-podcasts', `countries/${HOME_COUNTRY}`] }] },
  });
  return (d?.leads ?? []).filter((l) => l.catalog?.id).map((l) => ({
    title: l.title || '',
    sub: l.subtitle || '',
    art: `https://i.iheart.com/v3/catalog/show/${l.catalog.id}`,
  }));
}

async function fetchTopPlaylists() {
  const d = await gql(Q_PLAYLISTS, {
    countries: [`countries/${HOME_COUNTRY}`],
    tags: ['collections/playlist-directory', 'facets/featured-playlists'],
  });
  const items = d?.playlists?.directories?.list?.items ?? [];
  const out = [];
  items.forEach((it) => (it.children ?? []).forEach((c) => {
    const r = c.resource;
    if (r && r.title) out.push({ title: r.title, sub: r.description || '', art: r.urlImage || '' });
  }));
  return out;
}

async function fetchTopArtists() {
  const r = await fetch(`${AMP}/api/v2/recs/genre?genreId=${DEFAULT_ARTIST_GENRE}&limit=10&template=CR`);
  if (!r.ok) throw new Error(`amp ${r.status}`);
  const j = await r.json();
  return (j.values ?? []).map((v) => ({
    title: v.label || v.content?.name || '',
    art: `https://i.iheart.com/v3/catalog/artist/${v.contentId}`,
  }));
}


/* ---------- the collections behind Search, Podcasts and Playlists ----------
 * Every one of these sections is a `leads` query on a collection tag, which is
 * what RadioRepository reaches for. The tag names come from
 * webapi/query/leads/constants.ts in the web monorepo, and the section that
 * consumes each one comes from PodcastsContentTabView, PlaylistsContentTabView
 * and SearchDirectoryView.
 *
 * Every card these return has its label baked into the artwork, which is why
 * the app draws them with contentCardConfiguration .imageOnly. */
const Q_LEADS_CARDS = `fragment commonCardFields on Card {
  catalog { id } id img_uri link { urls { web device } } subtitle title }
  query Leads($query: QueryInput!, $locale: String) { leads(query: $query, locale: $locale) { ...commonCardFields } }`;

async function leads(collection) {
  const d = await gql(Q_LEADS_CARDS, {
    locale: HOME_LOCALE,
    query: { subscription: [{ tags: [`collections/${collection}`, `countries/${HOME_COUNTRY}`] }] },
  });
  return (d?.leads ?? []).map((l) => ({
    title: l.title || '',
    sub: l.subtitle || '',
    art: l.img_uri || '',
  }));
}

/* Browse All is not a collection: SearchDirectoryViewModel.fetchRadioGenres
 * calls RadioRepository.getLiveStationGenres, which is AMP's genre catalogue
 * filtered to live stations. */
async function fetchLiveGenres() {
  const r = await fetch(`${AMP}/api/v3/catalog/genres?genreType=liveStation`);
  if (!r.ok) throw new Error(`amp ${r.status}`);
  const j = await r.json();
  return (j.genres ?? []).map((g) => ({ title: g.genreName, art: g.image || '', id: g.id }));
}

/* Loads a set of sections in parallel into state.shelves, then repaints if the
 * tab that wanted them is still the one on screen. Each key fails on its own. */
function loadShelves(keys, view) {
  const pending = keys.filter((k) => !(k in state.shelves));
  if (!pending.length) return;
  pending.forEach((k) => { state.shelves[k] = null; });
  const SOURCES = {
    podcastDirectory: () => leads('podcast-directory'),
    podcastNetworks:  () => leads('podcast-networks'),
    popularPodcasts:  () => leads('popular-podcasts'),
    featuredPodcasts: () => leads('featured-podcasts'),
    playlistGenres:   () => leads('genre-playlists'),
    moods:            () => leads('perfect-for'),
    decades:          () => leads('decades'),
    featuredPlaylists: fetchTopPlaylists,
    liveGenres:        fetchLiveGenres,
  };
  Promise.all(pending.map((k) =>
    SOURCES[k]().then((v) => { state.shelves[k] = v; }).catch(() => { state.shelves[k] = []; })
  )).then(() => {
    if (state.view === view) {
      if (view === 'search') renderSearch();
      if (view === 'podcasts') renderPodcasts();
      if (view === 'playlists') renderPlaylists();
    }
  });
}

/* SectionLoadingVM.displayableSections drops any section whose data came back
 * empty, so a logged out listener never sees an empty shelf. Same rule here:
 * a section with nothing behind it renders nothing at all. */
function shelf(host, title, items, build, trailing) {
  host.innerHTML = '';
  if (!items || !items.length) { host.hidden = true; return false; }
  host.hidden = false;
  secHead(host, title, trailing);
  host.appendChild(build(items));
  return true;
}

/* Shared builders for the placeholder sections. The Figma frames for Podcasts
 * and Playlists show real podcast artwork and artist photography, which this
 * prototype has no right to reproduce, so every artwork slot renders as the
 * same grey plate the Home frame itself uses. Category names are the app's own
 * taxonomy and are kept, because they are what a participant navigates by. */
function railOf(items, build) {
  const rail = document.createElement('div');
  rail.className = 'rail-x';
  items.forEach((it, i) => rail.appendChild(build(it, i)));
  return rail;
}

/* An .imageOnly card: the artwork is the whole card, label included. */
function wideCard(item) {
  const b = document.createElement('button');
  b.className = 'wide-card';
  if (item && item.art) b.innerHTML = `<img src="${esc(item.art)}" alt="${esc(item.title || '')}" loading="lazy">`;
  else b.setAttribute('aria-label', item ? item.title : '');
  return b;
}

/* squareDefault: 91pt artwork, then doubleTitle or nothing at all. */
function squareCard(item, withText) {
  const b = document.createElement('button');
  b.className = 'sq-card';
  // .doubleTitle is a two line title with no subtitle at all, per
  // ContentCardConfiguration.showSubtitle.
  b.innerHTML =
    `<span class="ph">${art(item)}</span>` +
    (withText && item ? `<span class="cap">${esc(item.title)}</span>` : '');
  if (!withText && item) b.setAttribute('aria-label', item.title);
  return b;
}

/* ContentCardFeatured: square artwork beside a subtitle2 title and a caption. */
function listCard(item) {
  const b = document.createElement('button');
  b.className = 'list-card';
  b.innerHTML = `<span class="ph">${art(item)}</span>` +
    `<span class="txt"><span class="t">${esc(item.title)}</span>` +
    `<span class="d">${esc(item.sub || '')}</span></span>`;
  return b;
}

function grid2Of(items, limit) {
  const g = document.createElement('div');
  g.className = 'grid2';
  (limit ? items.slice(0, limit) : items).forEach((it) => g.appendChild(wideCard(it)));
  return g;
}

/* Search: a field, Most Popular Podcasts, then Browse All as a two column grid,
 * matching the Search frame. Recent searches stay above it because the
 * prototype needs a way back to a query a participant already ran. */

/* SectionLoadingVM never puts .adBanner in sectionOrder. It splices it into the
 * list of sections that actually rendered, at adBannerPlacement, which defaults
 * to .atIndex(1) — after the first surviving section, not after whichever
 * section happens to be first in the markup. With Continue Listening and
 * Recommended For You both dropped for want of a profile, index 1 on Podcasts
 * lands after Today's Top Podcasts, and on Playlists after Moods & Activities.
 * SearchDirectoryViewModel passes .none, so Search carries no ad at all. */
function placeAd(view, index) {
  const root = $(VIEW_IDS[view]);
  const ad = root.querySelector('.ad-slot');
  if (!ad) return;
  const shown = [...root.querySelectorAll('section.sec')].filter((el) => !el.hidden);
  const at = Math.min(index, shown.length);
  if (at === 0) root.prepend(ad);
  else shown[at - 1].after(ad);
}

/* Search, to SearchDirectoryView: a field, then two grids. Most Popular
 * Podcasts is the podcast directory cut to its first two entries, and Browse
 * All is AMP's live station genres. Both are Grid, cardShape .wide,
 * contentCardConfiguration .imageOnly. Recent searches sit above them because
 * the prototype needs a way back to a query a participant already ran. */
function renderSearchLanding() {
  const hist = $('shelfHistory');
  hist.innerHTML = '';
  hist.hidden = !state.searches.length;
  if (state.searches.length) {
    secHead(hist, 'Recent searches');
    const rail = document.createElement('div');
    rail.className = 'lib-row';
    state.searches.forEach((q) => {
      const b = document.createElement('button');
      b.className = 'lib-card';
      b.textContent = q;
      b.addEventListener('click', () => { $('searchInput').value = q; renderSearch(); });
      rail.appendChild(b);
    });
    hist.appendChild(rail);
  }

  // SearchDirectoryView takes topics.prefix(2) for this shelf.
  shelf($('secPopularPods'), 'Most Popular Podcasts', state.shelves.podcastDirectory,
        (items) => grid2Of(items, 2));

  if (shelf($('secBrowseAll'), 'Browse All', state.shelves.liveGenres, (items) => grid2Of(items))) {
    const g = $('secBrowseAll').querySelector('.grid2');
    [...g.children].forEach((b, i) => {
      const name = state.shelves.liveGenres[i].title;
      b.addEventListener('click', () => { $('searchInput').value = name; renderSearch(); });
    });
  }

  loadShelves(['podcastDirectory', 'liveGenres'], 'search');
}

/* Podcasts, to PodcastsContentTabView. Continue Listening and Recommended For
 * You are both personalised endpoints behind a profile, so with no session
 * they come back empty and, per displayableSections, do not render. */
function renderPodcasts() {
  $('secContinue').hidden = true;

  $('secPodRec').hidden = true;

  shelf($('secPodTop'), "Today's Top Podcasts", state.shelves.popularPodcasts,
        (items) => railOf(items, (it) => squareCard(it, true)));

  shelf($('secPodPicks'), 'Our Podcast Picks', state.shelves.featuredPodcasts,
        (items) => railOf(items, listCard));

  shelf($('secPodNetworks'), 'iHeartPodcast Networks', state.shelves.podcastNetworks,
        (items) => railOf(items, wideCard));

  shelf($('secPodTopics'), 'Topics', state.shelves.podcastDirectory,
        (items) => grid2Of(items));

  placeAd('podcasts', 1);
  loadShelves(['popularPodcasts', 'featuredPodcasts', 'podcastNetworks', 'podcastDirectory'], 'podcasts');
}

/* Playlists, to PlaylistsContentTabView. Recommended For You is personalised
 * and drops out the same way. Moods and Decades are squareDefault carousels
 * drawn imageOnly; Genres is a wide grid. */
function renderPlaylists() {
  $('secPlRec').hidden = true;

  shelf($('secPlMoods'), 'Moods & Activities', state.shelves.moods,
        (items) => railOf(items, (it) => squareCard(it, false)));

  shelf($('secPlDecades'), 'Decades', state.shelves.decades,
        (items) => railOf(items, (it) => squareCard(it, false)));

  shelf($('secPlFeatured'), 'Featured Playlists', state.shelves.featuredPlaylists,
        (items) => railOf(items, listCard));

  shelf($('secPlGenres'), 'Genres', state.shelves.playlistGenres,
        (items) => grid2Of(items));

  placeAd('playlists', 1);
  loadShelves(['moods', 'decades', 'featuredPlaylists', 'playlistGenres'], 'playlists');
}

function noteSearch(q) {
  if (!q) return;
  state.searches = [q, ...state.searches.filter((x) => x !== q)].slice(0, 8);
  try { localStorage.setItem('lrdV2Searches', JSON.stringify(state.searches)); } catch (e) {}
}

function renderSearch() {
  const q = $('searchInput').value.trim().toLowerCase();
  const host = $('searchResults');
  const hint = $('searchHint');
  host.innerHTML = '';

  $('searchClear').hidden = !q;
  if (!q) {
    $('searchLanding').hidden = false;
    hint.hidden = true;
    renderSearchLanding();
    return;
  }
  $('searchLanding').hidden = true;
  hint.hidden = false;
  // Searches all 2,721 stations rather than the loaded market, which is the
  // point of having them. Picking one from another market switches to it.
  //
  // The current market is walked first. National digital channels appear in
  // many markets, and de-duplicating in plain market order attributed them to
  // whichever came first alphabetically, so a jazz channel sitting in the New
  // York lineup was labelled "Anchorage, AK".
  const order = [
    ...window.LRD_US.markets.filter((m) => m[0] === state.marketId),
    ...window.LRD_US.markets.filter((m) => m[0] !== state.marketId),
  ];
  const seen = new Set();
  const hits = [];
  for (const market of order) {
    for (const id of (window.LRD_US.lineups[market[0]] || [])) {
      if (seen.has(id)) continue;
      const st = window.LRD_US.stations[id];
      if (!st) continue;
      const hay = `${st.name} ${st.desc} ${st.genre} ${st.dial} ${market[1]} ${market[2]}`.toLowerCase();
      if (!hay.includes(q)) continue;
      seen.add(id);
      hits.push({ s: st, market });
      if (hits.length >= 40) break;
    }
    if (hits.length >= 40) break;
  }

  hint.textContent = hits.length ? `${hits.length} station${hits.length === 1 ? '' : 's'}`
                                 : `Nothing matches "${$('searchInput').value.trim()}".`;

  hits.forEach(({ s, market }) => {
    const inMarket = state.stations.find((x) => x.apiId === s.id);
    const st = inMarket || {
      id: `s${s.id}`, apiId: s.id, name: s.name, dial: s.dial, genre: s.genre,
      description: s.desc, logo: s.logo, stream: s.stream, shows: [],
    };
    const row = stationRow(st, { sub: `${s.dial} • ${market[1]}, ${market[2]}` });
    if (!inMarket) {
      // Outside the loaded market: switch to it first so the guide stays honest.
      row.querySelector('.row').addEventListener('click', (e) => {
        if (e.target.closest('.more')) return;
        e.stopImmediatePropagation();
        switchMarket(market[0]);
        const found = state.stations.find((x) => x.apiId === s.id);
        if (found) setStation(found.id, true);
        switchView('radio');
      }, true);
    }
    host.appendChild(row);
  });
}

/* ---- boot ---- */
(function init() {
  state.stations = buildStations();
  try {
    const saved = localStorage.getItem('lrdV2Favorites');
    if (saved) state.favorites = new Set(JSON.parse(saved));
    const lib = localStorage.getItem('lrdV2Library');
    if (lib) state.library = new Set(JSON.parse(lib));
    const rec = localStorage.getItem('lrdV2Recent');
    if (rec) state.recent = JSON.parse(rec);
    const sq = localStorage.getItem('lrdV2Searches');
    if (sq) state.searches = JSON.parse(sq);
  } catch (e) {}

  // data/stations.js names the home station by its own id; resolve via apiId so
  // it matches the market lineup.
  const homeCurated = (window.LRD_STATIONS || []).find((s) => s.id === window.LRD_HOME_STATION);
  const home = state.stations.find((s) => homeCurated && s.apiId === homeCurated.apiId)
            || state.stations[0];
  if (home) {
    state.currentId = home.id;
    if (!state.favorites.size) state.favorites.add(home.id);
    loadTrack(home.id);   // the boot path had no fetch; only setStation did
  }

  audio = new Audio();
  audio.preload = 'none';
  // 'waiting' fires when the stream stalls mid-play as well as while connecting,
  // so the spinner covers rebuffering too.
  audio.addEventListener('playing', () => { state.playing = true;  state.buffering = false; renderPlayState(); });
  audio.addEventListener('pause',   () => { state.playing = false; state.buffering = false; renderPlayState(); });
  audio.addEventListener('waiting', () => { state.buffering = true;  renderPlayState(); });
  audio.addEventListener('stalled', () => { state.buffering = true;  renderPlayState(); });
  audio.addEventListener('error',   () => { state.buffering = false; renderPlayState(); flashError('Unable to play this stream'); });
  if (home && home.stream) audio.src = home.stream;

  $('hdrSearch').addEventListener('click', () => switchView('search'));
  $('miniPlay').addEventListener('click', () => toggleStation(state.currentId));
  $('searchInput').addEventListener('input', renderSearch);
  $('searchInput').addEventListener('change', () => noteSearch($('searchInput').value.trim()));
  $('searchClear').addEventListener('click', () => {
    $('searchInput').value = ''; renderSearch(); $('searchInput').focus();
  });
  $('scrim').addEventListener('click', closeSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetBack').addEventListener('click', () => { state.sheetPage = 'main'; renderSheet(); });
  $('sheetApply').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  $('btnLike').addEventListener('click', () => {
    state.liked = !state.liked; if (state.liked) state.disliked = false; render();
  });
  $('btnDislike').addEventListener('click', () => {
    state.disliked = !state.disliked; if (state.disliked) state.liked = false; render();
  });

  // Go through switchView so the landing tab gets the same chrome rules as a
  // tap on the tab bar would give it.
  switchView(LANDING_TAB);
  watchTrack();
  watchScroll();
  render();
})();
</script>
</body>
</html>

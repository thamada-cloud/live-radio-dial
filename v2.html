<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Radio Dial v2</title>
<script src="data/stations.js"></script>
<script src="data/stations-us.js"></script>
<script src="data/onair.js"></script>
<style>
  /* Design tokens, as named in the Figma file (Live-Radio-Dial-v2, node 314:13377) */
  :root{
    --surface-app:#f6f8f9;
    --surface-app-overlay:rgba(0,0,0,.7);
    --surface-shadow:rgba(0,0,0,.12);
    --on-surface-primary:#27292d;
    --on-surface-secondary:#3f4447;
    --on-surface-brand-monochrome:#000;
    --container-quaternary:#e6eaed;
    --container-primary-inverse:#fff;   /* trueWhite  */
    --on-surface-emphasis:#c6002b;      /* red600     */
    --tab-unselected:#3f4447;           /* grey500    */
    --hairline:#e6eaed;                 /* grey200    */
    --brand-red:#c6002b;
    --on-surface-informative:#0055b7; /* blue600, used for chips and Show All */
    --radius-primary:6px;      /* corner_radius_rounded_primary */
    --radius-tertiary:16px;    /* corner_radius_rounded_tertiary */
    /* Padding scale */
    --pad-sm1:4px; --pad-md1:8px; --pad-md2:12px; --pad-lg:16px; --pad-xl1:24px;
    /* Carousel geometry from Carousel.swift. Card width is
       (container - peek - padding - spacing*count) / count, and squareDefault
       shows 3 on a phone, so a 375pt screen gives 91pt cards, not the 112 I
       had guessed. */
    --peek:48px;
    /* Carousel.itemWidth is (container - cardPeek 48 - horizontalPadding 16 -
       itemSpacing 12 * count) / count, and Grid is (container - 16*2 -
       12*(cols-1)) / cols. On a 375pt screen that gives 91 / 143 / 299 / 165. */
    --card-sq3:calc((100vw - 48px - 16px - 36px) / 3);
    --card-sq2:calc((100vw - 48px - 16px - 24px) / 2);
    --card-featured:calc(100vw - 48px - 16px - 12px);
    --grid2:calc((100vw - 32px - 12px) / 2);
    /* image sizes straight out of the Figma variable set */
    --img-carousel-xxsmall:40px; --img-carousel-xsmall:56px;
    --img-carousel-small:66px;  --img-carousel-default:92px;
    --img-list-small:56px;
    --card-3:var(--card-sq3);
    --card-2:calc((100vw - 48px - 16px - 24px) / 2);
    --radius-circular:999px;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--surface-app);color:var(--on-surface-primary);
    font-family:var(--body);-webkit-font-smoothing:antialiased;
    min-height:100vh;overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;display:flex}
  img{display:block}
  .icon{display:block;width:100%;height:100%}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


  /* ---------- now playing ---------- */
  /* The frame put 88px of header above the artwork. With the header gone the
     art sat flush against the top edge, so keep a little room, plus the safe
     area on a notched device. */
  .page{padding:0 16px 96px}
  /* Radio hides the mini player, so its list only has to clear the tab bar. */
  #viewRadio{padding-bottom:calc(57px + env(safe-area-inset-bottom))}
  /* Artwork, metadata, thumbs and the filter chips hold position; only the
     station rows scroll under them. */
  .top-sticky{
    position:sticky;top:0;z-index:30;
    display:flex;flex-direction:column;gap:0;
    background:var(--surface-app);
    padding:calc(16px + env(safe-area-inset-top)) 0 16px;
  }
  .now{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .art{
    width:248px;height:248px;border-radius:var(--radius-primary);overflow:hidden;
    filter:drop-shadow(0 1px 1.5px var(--surface-shadow));background:#fff;
  }
  .art img{width:100%;height:100%;object-fit:cover;background:#fff}
  .meta-row{display:flex;align-items:center;justify-content:space-between;width:100%}
  .copy{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
  .copy .title{
    font-size:16px;line-height:18px;font-weight:600;color:var(--on-surface-primary);
    white-space:nowrap;overflow:hidden;
  }
  .copy .subtitle{
    font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-secondary);
    white-space:nowrap;overflow:hidden;
  }
  /* 60px fade so long track/artist strings run out rather than hard-clip */
  .copy::after{
    content:"";position:absolute;top:0;bottom:0;right:0;width:60px;pointer-events:none;
    background:linear-gradient(to right,rgba(246,248,249,0) 45%,var(--surface-app) 95%);
  }
  .live-badge,.hero-meta,.hero-desc{display:none}
  .thumbs{display:flex;align-items:center;justify-content:flex-end;flex-shrink:0}
  .thumbs button{padding:4px;border-radius:var(--radius-circular)}
  .thumbs button:hover{background:rgba(0,0,0,.05)}
  .thumbs button[aria-pressed="true"]{background:rgba(39,41,45,.1)}
  .thumbs .icon{width:32px;height:32px}

  /* ---------- filter chips ---------- */
  /* The wrapper owns the animation; the nav inside stays a horizontal scroller.
     grid-template-rows 1fr -> 0fr interpolates to the content's real height, so
     the easing maps one-to-one onto what you see. The previous version animated
     max-height from 56px on a 34px element, which meant the first third of every
     transition moved nothing and only then collapsed — that lag is what read as
     unsmooth. */
  .chips-wrap{
    display:grid;
    grid-template-rows:1fr;
    margin-top:16px;
    transition:grid-template-rows .34s cubic-bezier(.32,.72,0,1),
               margin-top .34s cubic-bezier(.32,.72,0,1),
               opacity .2s ease-out;
  }
  .chips-wrap.is-stowed{grid-template-rows:0fr;margin-top:0;opacity:0;pointer-events:none}
  .chips{
    display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    min-height:0;                 /* lets the grid row collapse below content height */
    margin:0 -16px;padding:0 16px;
    transition:transform .34s cubic-bezier(.32,.72,0,1);
  }
  .chips-wrap.is-stowed .chips{transform:translateY(-6px)}
  @media (prefers-reduced-motion: reduce){
    .chips-wrap,.chips{transition:none}
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;
    border:1px solid var(--on-surface-primary);border-radius:var(--radius-circular);
    padding:8px 16px;font-size:14px;line-height:16px;font-weight:600;
    color:var(--on-surface-primary);white-space:nowrap;
  }
  .chip .icon{width:16px;height:16px}
  .chip[aria-pressed="true"]{background:var(--on-surface-primary);color:#fff}
  .chip[aria-pressed="true"] .icon{filter:invert(1) brightness(2)}

  /* ---------- station guide (a list in v2, not a grid) ---------- */
  .guide{display:flex;flex-direction:column;gap:8px}
  .station{display:flex;gap:8px;align-items:center}
  /* The artwork is the play control: tap to start a station, tap again to stop
     it. The overlay is what tells you which station is live. */
  .station .logo{
    position:relative;display:block;padding:0;
    width:56px;height:56px;flex-shrink:0;border-radius:var(--radius-primary);
    background:#fff;box-shadow:0 1px 3px 0 var(--surface-shadow);overflow:hidden;
    cursor:pointer;
  }
  .station .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .station .logo .logo-overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    /* Lighter than it was: the stop control is now a filled disc that carries
       itself, so the scrim only has to keep it legible over pale artwork
       instead of doing the work of signalling "playing" on its own. */
    background:rgba(0,0,0,.34);opacity:0;transition:opacity .16s ease-out;
  }
  .station .logo .glyph{
    width:38px;height:38px;object-fit:contain;position:absolute;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));
  }
  /* Connecting to a live stream is not instant, so the artwork shows a spinner
     from the moment you tap until audio actually starts. */
  .station .logo .glyph.spin{width:30px;height:30px;animation:lrd-spin .9s linear infinite}
  @keyframes lrd-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .station .logo .glyph.spin{animation-duration:2.4s} }
  /* The overlay is up whenever there is something to say: this station is
     playing, it is connecting, or a pointer is over it. */
  .station.is-live .logo .logo-overlay,
  .station.is-buffering .logo .logo-overlay{opacity:1}
  @media (hover:hover){ .station .logo:hover .logo-overlay{opacity:1} }

  /* Idle station: hovering offers play. Playing station: a moving waveform
     holds the state on its own, and hovering swaps it for stop so it is clear
     the control does something. Connecting outranks both. */
  .station .logo .glyph,
  .station .logo .wave{display:none}
  .station .logo .glyph.play{display:block}
  .station.is-live .logo .glyph.play{display:none}
  .station.is-live .logo .wave{display:flex}
  @media (hover:hover){
    .station.is-live .logo:hover .wave{display:none}
    .station.is-live .logo:hover .glyph.stop{display:block}
  }
  .station.is-buffering .logo .glyph.play,
  .station.is-buffering .logo .glyph.stop,
  .station.is-buffering .logo .wave{display:none}
  .station.is-buffering .logo .glyph.spin{display:block}

  /* Waveform. Four bars on staggered delays, scaled rather than resized so the
     animation stays off the layout path. */
  .station .logo .wave{
    position:absolute;align-items:flex-end;gap:3px;height:22px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
  }
  .station .logo .wave i{
    width:3px;height:100%;border-radius:2px;background:#fff;
    transform-origin:bottom;transform:scaleY(.28);
    animation:lrd-wave .95s ease-in-out infinite;
  }
  .station .logo .wave i:nth-child(2){animation-delay:.18s}
  .station .logo .wave i:nth-child(3){animation-delay:.36s}
  .station .logo .wave i:nth-child(4){animation-delay:.54s}
  @keyframes lrd-wave{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
  @media (prefers-reduced-motion: reduce){
    /* Still reads as levels, just not moving. */
    .station .logo .wave i{animation:none;transform:scaleY(.45)}
    .station .logo .wave i:nth-child(2){transform:scaleY(1)}
    .station .logo .wave i:nth-child(3){transform:scaleY(.65)}
    .station .logo .wave i:nth-child(4){transform:scaleY(.85)}
  }
  @media (prefers-reduced-motion: reduce){ .station .logo .logo-overlay{transition:none} }
  .station .row{
    flex:1;min-width:0;height:56px;min-height:44px;display:flex;align-items:center;gap:8px;
    background:var(--container-quaternary);border-radius:var(--radius-primary);
    padding:0 16px;border:2px solid transparent;text-align:left;
  }
  .station.is-playing .row{border-color:var(--brand-red)}
  .station .row .metadata{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
  /* Line one is the station name, line two its description. The on-air show and
     time live in the now-playing block above, not on every row. */
  .station .row .show{
    font-size:14px;line-height:16px;font-weight:600;color:var(--on-surface-secondary);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .station .row .when{
    font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-primary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .station .row .more{padding:4px;border-radius:var(--radius-circular);flex-shrink:0}
  .station .row .more .icon{width:24px;height:24px}
  .empty{padding:32px 0;text-align:center;color:var(--on-surface-secondary);font-size:14px}


  /* ---------- bottom tab bar ----------
     Built from the iOS app; the Figma file has no tab bar.
     Tabs and order:  iHeart/AppNavigation/TabBarConfigFiveTabs.json
     49pt height:     TabBarViewModel
     Appearance:      IHRAppDelegate configures UITabBarAppearance with
                      container_primary_inverse background,
                      on_surface_secondary unselected,
                      on_surface_emphasis selected.
     Those tokens resolve in Multiplatform/DesignTokens/ColorManager.swift. In
     LIGHT theme container_primary_inverse is trueWhite and on_surface_emphasis
     is red600, so the bar is white with a red selected tab. An earlier cut read
     "inverse" as dark and built a black bar, which is the dark-theme pairing. */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;align-items:stretch;
    height:calc(49px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--container-primary-inverse);
    border-top:1px solid var(--hairline);
  }
  .tabbar button{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:6px 2px 4px;color:var(--tab-unselected);
  }
  .tabbar button[aria-current="page"]{color:var(--on-surface-emphasis)}
  /* Inlined, not <img>: an SVG loaded through <img> cannot inherit the page's
     color, so currentColor resolved to black and the icons vanished. */
  .tabbar svg{width:24px;height:24px;display:block;fill:currentColor}
  .tabbar .label{
    font-size:10px;line-height:12px;font-weight:500;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }



  /* ---------- wide screens: the now-playing hero ----------
     On a phone the now-playing block is compact: art, one line of copy, thumbs.
     Given width it becomes a hero, with the copy set large on the left and the
     artwork on the right, and room for things the phone has no space for: a
     live badge, how long is left in the show, and the station's description.
     The station list below is unchanged. */
  @media (min-width: 1024px){
    .page{max-width:1240px;margin:0 auto;padding:32px 24px 96px}
    /* The phone gets this gap from .top-sticky's bottom padding. Setting
       padding:0 here removed it and the chips sat flush against the first row,
       since .page is display:block and has no gap to fall back on. */
    .top-sticky{position:static;padding:0 0 24px;gap:24px}

    /* 320 rather than 360: the copy column runs to ~300px, so a taller image
       left ~57px of dead space under the thumbs once centring took effect. */
    .now{flex-direction:row;align-items:center;gap:40px}
    .now .art{order:2;width:320px;height:320px;flex-shrink:0}
    .meta-row{order:1;flex:1;min-width:0;flex-direction:column;align-items:flex-start;gap:20px}
    .copy{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:0}
    /* The phone clips this to one line with a fade; here it can breathe. */
    .copy::after{display:none}
    .copy .title{font-size:44px;line-height:50px;font-weight:700;white-space:normal;overflow:visible}
    .copy .subtitle{font-size:16px;line-height:22px;margin-top:8px;white-space:normal;overflow:visible}

    .live-badge{
      display:inline-block;margin-bottom:12px;padding:4px 10px;border-radius:4px;
      background:var(--brand-red);color:#fff;
      font-size:12px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    }
    .hero-meta{
      display:flex;align-items:center;gap:8px;margin-top:12px;
      font-size:14px;line-height:20px;color:var(--on-surface-secondary);
    }
    .hero-meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
    .hero-meta .pill{
      border:1px solid var(--on-surface-secondary);border-radius:3px;
      padding:0 6px;font-size:12px;line-height:18px;font-weight:600;
    }
    .hero-desc{
      display:block;margin-top:16px;max-width:60ch;
      font-size:15px;line-height:22px;color:var(--on-surface-secondary);
    }
    .thumbs{align-self:flex-start}
    /* No sticky header up here, so nothing stows: reset the wrapper and let
       the chips wrap onto a second line instead of scrolling sideways. */
    .chips-wrap{margin-top:0;grid-template-rows:1fr;opacity:1}
    .chips{margin:0;padding:0;flex-wrap:wrap;overflow:visible;transform:none}
    .guide{gap:8px}
  }

  /* Two columns of rows once there is room, so a wide window does not leave a
     single column of 56px rows stranded in the middle. */
  @media (min-width: 1280px){
    .guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
  }

  /* ---------- "there is more below" fade ----------
     Only shown when the list bottom is genuinely ambiguous. If a decent slice
     of the next row is already peeking above the tab bar, that says "more"
     perfectly well on its own and the fade is just haze over content. */
  .list-fade{
    position:fixed;left:0;right:0;z-index:40;height:64px;pointer-events:none;
    bottom:calc(49px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--surface-app),transparent);
    opacity:0;transition:opacity .2s ease-out;
  }
  .list-fade.is-on{opacity:1}
  @media (prefers-reduced-motion: reduce){ .list-fade{transition:none} }

  /* ---------- tab views ----------
     One screen at a time. Radio is the built screen; the rest exist so the tab
     bar goes somewhere, which matters when a study participant is meant to move
     around the app rather than sit on a single screen. */
  .view{display:none}
  .view.is-active{display:block}
  .screen-title{
    /* h1 in the type scale, with its -0.5 tracking. */
    font-size:32px;line-height:38px;font-weight:700;letter-spacing:-.5px;
    color:var(--on-surface-brand-monochrome);
    padding:calc(16px + env(safe-area-inset-top)) 0 16px;
  }

  /* Horizontal carousels. Spacing and peek are Carousel.swift's values. */
  .shelf{margin-bottom:var(--pad-xl1)}
  .shelf h2{
    /* Section header is h4 in the type scale. */
    font-size:18px;line-height:24px;font-weight:600;color:var(--on-surface-primary);
    margin-bottom:var(--pad-md2);
  }
  .shelf .rail{
    display:flex;gap:var(--pad-md2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    margin:0 calc(-1 * var(--pad-lg));padding:0 var(--pad-lg) var(--pad-sm1);
  }
  .shelf .rail::-webkit-scrollbar{display:none}
  .tile{width:var(--card-3);flex-shrink:0;text-align:left;background:none;border:none;padding:0;display:block}
  .tile .art-box{
    display:block;position:relative;width:var(--card-3);height:var(--card-3);
    border-radius:var(--radius-primary);
    overflow:hidden;background:#fff;box-shadow:0 1px 3px 0 var(--surface-shadow);
  }
  .tile .art-box img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .name{
    /* subtitle2 */
    margin-top:var(--pad-md1);font-size:14px;line-height:18px;font-weight:600;
    letter-spacing:-.5px;color:var(--on-surface-primary);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tile .sub{
    /* caption1 */
    font-size:12px;line-height:16px;color:var(--on-surface-secondary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* Search. */
  .searchbar{
    display:flex;align-items:center;gap:8px;padding:10px 12px;
    background:var(--container-quaternary);border-radius:10px;
  }
  .searchbar .icon{width:20px;height:20px;flex-shrink:0;opacity:.7}
  .searchbar input{
    flex:1;min-width:0;border:none;background:none;font:inherit;font-size:16px;
    color:var(--on-surface-primary);outline:none;
  }
  .search-hint{
    margin:12px 0 4px;font-size:13px;line-height:18px;color:var(--on-surface-secondary);
  }

  /* Section header, the app's pattern of a title with a chevron affordance. */
  .sec-title{font-size:18px;line-height:24px;font-weight:600;color:var(--on-surface-primary);margin:0 0 var(--pad-md2)}
  .shelf h2{display:flex;align-items:center;gap:6px}
  .shelf h2 .chev{width:16px;height:16px;opacity:.5;transform:rotate(-90deg)}

  /* Your Library row. */
  .lib-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .lib-row::-webkit-scrollbar{display:none}
  .lib-card{
    flex-shrink:0;display:flex;align-items:center;gap:8px;padding:12px 16px;
    background:var(--container-quaternary);border-radius:10px;border:none;
    font-size:14px;line-height:18px;font-weight:600;letter-spacing:-.5px;
    color:var(--on-surface-primary);white-space:nowrap;
  }
  .lib-card svg{width:20px;height:20px;fill:currentColor}

  /* Browse All grid on Search. */
  .genre-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .genre-card{
    height:72px;display:flex;align-items:flex-end;padding:10px 12px;border:none;
    border-radius:var(--radius-primary);color:#fff;font-size:14px;line-height:18px;
    font-weight:700;letter-spacing:-.5px;text-align:left;
    background:var(--on-surface-primary);
  }
  .search-clear{padding:2px;border-radius:999px;flex-shrink:0}
  .search-clear .icon{width:16px;height:16px;opacity:.6}

  /* Honest placeholder for the two tabs with no data behind them. */
  .tab-note{
    padding:12px 14px;margin-bottom:16px;border-radius:10px;
    background:var(--container-quaternary);
    font-size:13px;line-height:19px;color:var(--on-surface-secondary);
  }
  .sec-list{list-style:none;display:flex;flex-direction:column;gap:2px}
  .sec-list li{
    padding:var(--pad-lg) var(--pad-sm1);font-size:18px;line-height:24px;
    font-weight:600;color:var(--on-surface-primary);
    border-bottom:1px solid var(--hairline);
  }

  /* ---------- app chrome, shared by every tab ----------
     Header, mini player and the 320x50 ad slot appear on every screen in the
     Figma frames. None of it existed before. */
  .app-header{
    position:sticky;top:0;z-index:35;background:var(--surface-app);
    display:flex;align-items:center;gap:var(--pad-lg);
    height:44px;padding:0 var(--pad-lg);
  }
  /* Asset.IHeartLogos.ihrTopBarLogo, light variant, at its natural 139x44. Its
     artwork is 106x21 sitting at x 0.9 / y 11.5, so the asset's own insets do
     the aligning; scaling it would put the wordmark off the 16pt grid. */
  .app-header .brand{width:139px;height:44px;flex-shrink:0;margin-right:auto}
  .app-header .h-btn{padding:2px;border-radius:999px;position:relative}
  .app-header .h-btn img{width:22px;height:22px;object-fit:contain}
  .app-header .badge{
    position:absolute;top:-2px;right:-4px;min-width:15px;height:15px;padding:0 4px;
    border-radius:999px;background:var(--brand-red);color:#fff;
    font-size:10px;line-height:15px;font-weight:700;text-align:center;
  }
  /* Search swaps the brand for a plain title. */
  .app-header .title{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.4px;margin-right:auto}

  /* The app's own house creative, which DefaultLeaderboardAd paints into this
     slot whenever a programmatic ad is not available. It is the right fill for
     a research build: it is a genuine 320x50 that iHeart serves itself, it is
     the same on every load, and it pulls in no ad tech and no third party
     tracking of a participant. It does not navigate, so a task cannot end with
     someone in an app store. */
  .ad-slot{
    width:320px;height:50px;margin:var(--pad-lg) auto;border-radius:2px;overflow:hidden;
    background:#c9ced2;
  }
  .ad-slot img{width:100%;height:100%;object-fit:cover;display:block}

  /* Mini player, pinned above the tab bar. MiniPlayer.swift is a VStack of the
     content row and, when there is a duration, a progress bar. The row pads
     Padding.sm1 (4) all round, spaces by Padding.md2 (12), holds a 52pt
     artwork, three 16pt text lines at spacing 0, and a controls group of a
     40pt preset button and a 40pt play button spaced by 4 and held between 80
     and 100 wide. TabBarView fills the container with containerPrimaryInverse
     behind a 12pt top corner radius.

     No progress bar here: shouldShowProgressBar returns false for .live and
     .ad, and this prototype only ever plays live radio. 4 + 52 + 4 gives the
     60pt the frame shows once the 3pt bar is gone. */
  .mini{
    position:fixed;left:0;right:0;z-index:45;
    bottom:calc(49px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
    background:var(--container-primary-inverse);
    border-radius:12px 12px 0 0;overflow:hidden;
  }
  /* The HStack carries the Padding.sm1 inset; the bar is its sibling in the
     VStack, so it runs edge to edge. 4 + 52 + 4 + 3 is the 63 the frame shows. */
  .mini-row{display:flex;align-items:center;gap:var(--pad-md2);padding:var(--pad-sm1)}
  .mini .art{width:52px;height:52px;border-radius:var(--radius-primary);overflow:hidden;
    background:#fff;flex-shrink:0;box-shadow:0 1px 3px 0 var(--surface-shadow)}
  .mini .art img{width:100%;height:100%;object-fit:cover}
  .mini .lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
  .mini .lines span{height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* caption1 and caption2: both 12/16, the title semibold. */
  .mini .l1,.mini .l3{font-size:12px;line-height:16px;letter-spacing:-.35px;
    color:var(--on-surface-secondary)}
  .mini .l2{font-size:12px;line-height:16px;letter-spacing:-.35px;font-weight:600;
    color:var(--on-surface-primary)}
  /* MiniPlayer.swift is a VStack of the row and then ProgressBarView: a 3pt
     containerTertiary track with a containerEmphasis fill, so the bar sits
     between the player and the tab bar. */
  .mini .progress{height:3px;background:var(--container-quaternary)}
  .mini .progress i{display:block;height:100%;background:var(--container-emphasis,var(--brand-red))}
  .mini .controls{display:flex;align-items:center;gap:var(--pad-sm1);flex-shrink:0;
    min-width:80px;max-width:100px;justify-content:flex-end}
  .mini .m-btn{width:40px;height:40px;align-items:center;justify-content:center;
    padding:0;flex-shrink:0}
  .mini .m-btn img{width:24px;height:24px}
  /* PlayButtonView draws Asset.Icons.playbackPlay at frame(iconSize, iconSize),
     and that asset is the filled circle with the glyph knocked out of it, so
     the button is one 40pt image rather than a circle with a small triangle. */
  .mini .m-play{width:40px;height:40px;padding:0;flex-shrink:0}
  .mini .m-play img{width:40px;height:40px;display:block}

  /* Section header with an optional trailing control. */
  .sec-head{display:flex;align-items:center;gap:var(--pad-md1);margin-bottom:var(--pad-md2)}
  .sec-head h2{font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.2px;
    color:var(--on-surface-primary);margin:0}
  .sec-head .lead{width:20px;height:20px;flex-shrink:0}
  .sec-head .spacer{margin-left:auto}
  .sec-head .link{font-size:14px;font-weight:600;color:var(--brand-red)}
  .sec-head .mini-chip{
    display:flex;align-items:center;gap:4px;max-width:124px;height:28px;padding:0 10px;
    border-radius:999px;background:var(--container-primary-inverse);border:none;
    box-shadow:0 1px 3px 0 var(--surface-shadow);
    font-size:12px;line-height:16px;font-weight:600;letter-spacing:-.35px;
    color:var(--on-surface-informative);white-space:nowrap;
  }
  .sec-head .mini-chip .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sec-head .mini-chip .cv{flex-shrink:0;width:10px;height:10px}
  .sec-head .icon-btn img{width:20px;height:20px;opacity:.8}

  .sec{margin-bottom:var(--pad-lg)}

  /* Presets, a row of small tiles with empty add slots. */
  .preset-row{display:flex;gap:var(--pad-md1);overflow-x:auto;scrollbar-width:none;
    margin:0 calc(-1 * var(--pad-lg));padding:0 var(--pad-lg)}
  .preset-row::-webkit-scrollbar{display:none}
  .preset{width:var(--img-carousel-small);height:var(--img-carousel-small);flex-shrink:0;border-radius:var(--radius-primary);
    overflow:hidden;background:#fff;box-shadow:0 1px 3px 0 var(--surface-shadow);border:none;padding:0}
  .preset img{width:100%;height:100%;object-fit:cover;display:block}
  .preset.empty{background:var(--container-quaternary);box-shadow:none;
    display:flex;align-items:center;justify-content:center;color:var(--on-surface-secondary);font-size:24px;font-weight:300}

  /* Live Radio Dial cards: logo, title, description, play. */
  /* RadioDialCarouselLayout gives 138x68 with hSpacing 12 and a 0.5 peek;
     RadioCardView pads 8 all round, stacks title over a row of subtitle plus a
     24pt play icon, and spaces them by 2. The subtitle holds a 32pt floor so
     a one line description does not shrink the card. */
  .dial-card{
    width:138px;height:68px;flex-shrink:0;text-align:left;
    background:var(--container-primary-inverse);border:none;
    border-radius:var(--radius-primary);padding:var(--pad-md1);
    box-shadow:0 1px 3px 0 var(--surface-shadow);
    display:flex;flex-direction:column;gap:2px;overflow:hidden;
  }
  .dial-card .t{font-size:14px;line-height:16px;font-weight:600;letter-spacing:-.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
  .dial-card .row{display:flex;align-items:flex-end;gap:var(--pad-md1);min-width:0}
  .dial-card .d{flex:1;min-width:0;min-height:32px;
    font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-secondary);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dial-card .play{width:24px;height:24px;flex-shrink:0}

  .scan-btn{
    display:flex;align-items:center;justify-content:center;gap:var(--pad-sm2,6px);width:100%;
    height:32px;margin-top:var(--pad-md2);padding:0 var(--pad-md2);
    background:var(--container-primary-inverse);border:none;border-radius:999px;
    box-shadow:0 1px 3px 0 var(--surface-shadow);
    color:var(--brand-red);font-size:14px;line-height:16px;font-weight:600;letter-spacing:-.5px;
  }
  .scan-btn img{width:16px;height:16px}

  /* Your Library pills. */
  .lib-pills{display:flex;gap:var(--pad-md1);flex-wrap:wrap}
  .lib-pill{padding:8px 18px;border-radius:999px;border:1px solid var(--on-surface-primary);
    background:none;font-size:14px;font-weight:600;color:var(--on-surface-primary)}

  /* Numbered ranking rows and cards. */
  /* ContentCardTrending.swift: HStack spacing 0 of a 40x40 left aligned numeral
     and a card of a 56pt image, Padding.md1, and a two line subtitle2 title. */
  .rank-list{display:flex;flex-direction:column;gap:var(--pad-md1)}
  .rank-row{display:flex;align-items:center;gap:0;width:100%;text-align:left}
  .rank-num{
    width:40px;height:40px;flex-shrink:0;
    object-fit:contain;object-position:left center;
  }
  .rank-card-row{
    flex:1;min-width:0;height:var(--img-list-small);display:flex;align-items:center;
    gap:var(--pad-md1);background:var(--container-primary-inverse);
    border-radius:var(--radius-primary);box-shadow:0 1px 3px 0 var(--surface-shadow);
    overflow:hidden;
  }
  .rank-thumb{width:var(--img-list-small);height:var(--img-list-small);flex-shrink:0;
    background:linear-gradient(160deg,#c3c8cc,#9aa1a6);overflow:hidden}
  .rank-thumb img{width:100%;height:100%;object-fit:cover}
  .rank-title{font-size:14px;line-height:16px;font-weight:600;letter-spacing:-.5px;
    color:var(--on-surface-primary);padding-right:var(--pad-md1);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .show-all{display:flex;align-items:center;justify-content:center;width:100%;height:40px;
    margin-top:var(--pad-lg);background:var(--container-primary-inverse);border:none;
    border-radius:999px;box-shadow:0 1px 3px 0 var(--surface-shadow);
    color:var(--on-surface-informative);font-size:16px;line-height:20px;font-weight:600}

  .rank-rail{display:flex;align-items:flex-start;gap:var(--pad-md2);overflow-x:auto;scrollbar-width:none;
    margin:0 calc(-1 * var(--pad-lg));padding:0 var(--pad-lg)}
  .rank-rail::-webkit-scrollbar{display:none}
  /* ContentCardTopRanker.swift is an HStack: the numeral sits in its own column
     to the LEFT of a 92pt square card, tucked 2pt under the artwork's left edge
     and drawn behind it, with its top padded to cardWidth - height - 10. */
  .rank-card{display:flex;align-items:flex-start;flex-shrink:0;text-align:left}
  .rank-card .n{
    flex-shrink:0;position:relative;z-index:0;display:block;
    margin-top:calc(92px - 40px - 10px);margin-right:-2px;
    height:40px;width:auto;
  }
  .rank-card .top{display:block;position:relative;z-index:1;width:92px;flex-shrink:0}
  .rank-card .ph{display:block;width:92px;height:92px;border-radius:var(--radius-primary);
    background:linear-gradient(160deg,#c3c8cc,#9aa1a6);overflow:hidden}
  .rank-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .rank-card .ph.circle{border-radius:999px}
  .rank-card .top .cap{margin-top:var(--pad-sm1);font-size:14px;line-height:16px;font-weight:600;
    letter-spacing:-.5px;color:var(--on-surface-primary);text-align:center;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rank-card .top .cap2{display:-webkit-box;margin-top:var(--pad-sm1);
    font-size:12px;line-height:16px;letter-spacing:-.35px;text-align:center;
    color:var(--on-surface-primary);
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .error{
    position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--brand-red);color:#fff;padding:12px 16px;border-radius:8px;
    font-size:14px;font-weight:500;box-shadow:0 10px 15px rgba(0,0,0,.2);max-width:calc(100% - 32px);
  }

  /* ---------- bottom sheet (matches the v1 filter sheet pattern) ---------- */
  @keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4)}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:101;display:flex;flex-direction:column;
    background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);
    max-height:80vh;animation:sheet-up .3s ease-out;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet .grabber{display:flex;justify-content:center;padding:12px 0 8px}
  .sheet .grabber i{width:40px;height:4px;border-radius:999px;background:#d1d5db;display:block}
  .sheet header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 24px 16px;border-bottom:1px solid #e5e7eb;
  }
  .sheet header h2{font-size:20px;line-height:24px;font-weight:600;color:var(--on-surface-primary)}
  .sheet header button{padding:8px;border-radius:var(--radius-circular)}
  .sheet header button:hover{background:#f3f4f6}
  .sheet header .icon{width:20px;height:20px}
  .sheet .options{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:4px}
  .sheet .option{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 16px;border-radius:8px;background:transparent;text-align:left;
  }
  .sheet .option:hover{background:#f3f4f6}
  .sheet .option .label{display:flex;align-items:center;gap:8px;min-width:0}
  .sheet .option .name{font-weight:500;color:var(--on-surface-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .option .count{font-size:14px;color:#6b7280;flex-shrink:0}
  .sheet .option .icon{width:20px;height:20px;flex-shrink:0}
  .sheet .option[aria-selected="true"]{background:rgba(198,0,43,.1)}
  .sheet .option[aria-selected="true"] .name{color:var(--brand-red)}
  .sheet .option[aria-selected="true"] .icon{filter:invert(16%) sepia(96%) saturate(5000%) hue-rotate(338deg) brightness(85%) contrast(105%)}
  .sheet footer{padding:16px 24px;border-top:1px solid #e5e7eb;background:#f9fafb}
  .sheet footer button{
    width:100%;justify-content:center;background:var(--brand-red);color:#fff;
    padding:12px;border-radius:8px;font-weight:500;
  }
  .sheet footer button:hover{background:#a00023}
  /* Location sheet rows, per iOS HeaderSheetStyle:
     locationRowCellHeight 64, locationRowEdgeInsets 4, icon 20,
     title = body3, subtitle = caption1 in grey400. */
  .sheet .loc-row{
    width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:0 4px;background:transparent;text-align:left;
  }
  .sheet .loc-row:hover{background:#f3f4f6;border-radius:8px}
  .sheet .loc-row .text{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sheet .loc-row .t{font-size:16px;line-height:20px;color:var(--on-surface-primary)}
  .sheet .loc-row .s{font-size:12px;line-height:16px;letter-spacing:-.35px;color:#9ca3af;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .loc-row .icon{width:20px;height:20px;flex-shrink:0;color:var(--on-surface-primary)}
  .sheet .loc-row .icon.dim{opacity:.35}
  .sheet .back{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 0;border-radius:8px}
  .sheet .back .icon{width:20px;height:20px}
  .sheet .city-search{
    width:100%;margin-bottom:8px;padding:10px 12px;font:inherit;font-size:16px;
    border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--on-surface-primary);
  }
  .sheet .city-search:focus{outline:2px solid var(--brand-red);outline-offset:-1px}
  .sheet .action-row{
    width:100%;display:flex;align-items:center;gap:16px;
    padding:14px 8px;border-radius:8px;background:transparent;text-align:left;
  }
  .sheet .action-row:hover{background:#f3f4f6}
  .sheet .action-row .icon{width:24px;height:24px;flex-shrink:0;color:var(--on-surface-primary)}
  .sheet .action-row .name{font-size:16px;line-height:22px;font-weight:500;color:var(--on-surface-primary)}
  .sheet .note{padding:0 24px 16px;font-size:13px;line-height:18px;color:#6b7280}

  /* ---------- shared card shapes used by Search, Podcasts and Playlists ----------
     Sizes come straight out of the Figma frames: the wide card is 165x94 in a
     343 column, the square carousel card is image/carousel/1:1_default (92),
     and the grids are two columns of wide cards with 12pt gutters. */
  /* A button centres its own content, so a card left to stretch to the tallest
     card in the row floats its artwork down by half a line. Top align them. */
  .rail-x{display:flex;align-items:flex-start;gap:var(--pad-md2);
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    margin:0 calc(-1 * var(--pad-lg));padding:0 var(--pad-lg) var(--pad-sm1)}
  .rail-x::-webkit-scrollbar{display:none}

  /* ContentCardWide is 16:9 of its width, and every card the app draws with
     contentCardConfiguration .imageOnly has its label baked into the artwork,
     so these carry no text of their own. */
  .wide-card{
    width:var(--card-sq2);aspect-ratio:16/9;flex-shrink:0;border:none;padding:0;
    border-radius:var(--radius-primary);overflow:hidden;position:relative;
    box-shadow:0 1px 3px 0 var(--surface-shadow);
    background:linear-gradient(160deg,#c3c8cc,#8f979d);
  }
  .wide-card img{width:100%;height:100%;object-fit:cover;display:block}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--pad-md2)}
  .grid2 .wide-card{width:100%}

  /* Square carousel card: 92pt artwork, then up to two lines of title. */
  .sq-card{display:block;width:var(--card-sq3);flex-shrink:0;text-align:left;background:none;border:none;padding:0}
  .sq-card .ph{display:block;width:100%;aspect-ratio:1/1;border-radius:var(--radius-primary);
    overflow:hidden;background:linear-gradient(160deg,#c3c8cc,#8f979d);
    box-shadow:0 1px 3px 0 var(--surface-shadow)}
  .sq-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .sq-card .cap{margin-top:var(--pad-sm1);font-size:14px;line-height:16px;font-weight:600;
    letter-spacing:-.5px;color:var(--on-surface-primary);text-align:center;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sq-card .cap2{display:-webkit-box;margin-top:var(--pad-sm1);
    font-size:12px;line-height:16px;letter-spacing:-.35px;text-align:center;
    color:var(--on-surface-primary);
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* Wide list card: artwork on the left, two lines of copy on the right. */
  /* ContentCardFeatured: cardWidth 299, a 92pt square image, then the copy. */
  .list-card{
    width:var(--card-featured);height:92px;flex-shrink:0;display:flex;
    align-items:center;gap:var(--pad-md2);text-align:left;border:none;padding:0;overflow:hidden;
    background:var(--container-primary-inverse);border-radius:var(--radius-primary);
    box-shadow:0 1px 3px 0 var(--surface-shadow);
  }
  .list-card .ph{width:92px;height:92px;flex-shrink:0;overflow:hidden;
    background:linear-gradient(160deg,#c3c8cc,#8f979d)}
  .list-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .list-card .txt{min-width:0;padding-right:var(--pad-md2);display:flex;flex-direction:column;gap:2px}
  .list-card .t{font-size:14px;line-height:16px;font-weight:600;letter-spacing:-.5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .list-card .d{font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-secondary);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* Continue Listening row on Podcasts. */
  .cl-row{
    display:flex;align-items:center;gap:var(--pad-md2);width:100%;height:72px;padding:0 var(--pad-md2) 0 0;
    background:var(--container-primary-inverse);border-radius:var(--radius-primary);
    box-shadow:0 1px 3px 0 var(--surface-shadow);overflow:hidden;text-align:left;
  }
  .cl-row .ph{width:56px;height:56px;margin-left:var(--pad-md1);flex-shrink:0;
    border-radius:var(--radius-primary);background:linear-gradient(160deg,#c3c8cc,#8f979d)}
  .cl-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .cl-row .t{font-size:14px;line-height:16px;font-weight:600;letter-spacing:-.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cl-row .d{font-size:12px;line-height:16px;letter-spacing:-.35px;color:var(--on-surface-secondary)}
  .cl-row .act{width:20px;height:20px;flex-shrink:0;opacity:.7}

  /* Search field, the app's own shape: white plate, 44 tall, primary radius. */
  .search-field{
    display:flex;align-items:center;gap:var(--pad-md1);height:44px;padding:0 var(--pad-md2);
    margin-bottom:var(--pad-lg);background:var(--container-primary-inverse);
    border-radius:var(--radius-primary);box-shadow:0 1px 3px 0 var(--surface-shadow);
  }
  .search-field .icon{width:20px;height:20px;flex-shrink:0}
  .search-field input{
    flex:1;min-width:0;border:none;background:none;font:inherit;font-size:16px;line-height:20px;
    color:var(--on-surface-primary);outline:none;
  }
  .search-field input::placeholder{color:var(--on-surface-secondary)}

  /* A rail scrolls on x, which makes the browser clip on y as well, and that
     shears the cards' 0 1px 3px shadow off top and bottom. Pad the scroller and
     pull the same amount back off as margin, so the shadow has room without
     moving anything. */
  .rail-x,.preset-row,.rank-rail,.lib-row,.shelf .rail{
    padding-top:4px;padding-bottom:6px;margin-top:-4px;margin-bottom:-6px;
  }
  [hidden]{display:none !important}
</style>
</head>
<body>

<header class="app-header" id="appHeader">
  <img class="brand" src="assets/app/ihr-topbar-logo.svg" alt="iHeart" width="139" height="44">
  <div class="title" id="headerTitle" hidden>Search</div>
  <button class="h-btn" id="hdrSearch" aria-label="Search"><img src="assets/v2/search.svg" alt=""></button>
  <button class="h-btn" aria-label="Notifications"><img src="assets/app/bellIcon.svg" alt=""><span class="badge">1</span></button>
  <button class="h-btn" aria-label="Settings"><img src="assets/app/settings.svg" alt=""></button>
</header>

<main class="page view is-active" id="viewRadio">
  <div class="top-sticky">
  <section class="now">

<script>
/* ============================================================================
 * Live Radio Dial v2
 * Built from Figma: Live-Radio-Dial-v2, node 314:13377
 *
 * v2 is a different information architecture from v1, not a restyle. The
 * two-axis EPG grid is gone: there is no time axis and no horizontal scroll.
 * Each station is one row showing what is on right now plus its time range,
 * and the filter icon and bottom sheet are replaced by a scrolling chip row.
 *
 * Deliberately vanilla: v1 runs on the Claude Design x-dc runtime, and keeping
 * v2 independent means neither version can break the other. Both read the same
 * data/stations.js so the lineup and schedules stay in one place.
 * ========================================================================== */

const RESEARCH = {
  // Matches v1 so the two versions are comparable in a study. See v1's
  // Component.RESEARCH for why the clock is pinned rather than live.
  pinnedNow: [9, 20],
  // Pulls the actual song on air from iHeart's live-meta API. Real and live,
  // which is the point, but it means the hero is not identical between two
  // people looking at once. Set false for a study build, where every
  // participant must see the same screen; the hero then falls back to the
  // show and station, which are fixed.
  liveTrackData: true,
};

const state = {
  stations: [],
  currentId: null,
  playing: false,
  favorites: new Set(),
  liked: false,
  disliked: false,
  track: null,
  buffering: false,
  library: new Set(),
  rowStation: null,
  view: 'radio',
  recent: [],
  searches: [],
  filter: { chip: null, genre: null, location: null },
  sheet: null,
  sheetPage: 'main',
  marketId: 159,            // New York, the default lineup
  citySearch: '',
  locationMethod: 'current',
  zip: '',
  // The four ranked Home sections, filled once from the live endpoints.
  home: { trending: null, podcasts: null, playlists: null, artists: null,
          loading: false, loaded: false },
  // Section data for Search, Podcasts and Playlists, keyed by shelf name.
  shelves: {},
};

const $ = (id) => document.getElementById(id);
const now = () => {
  const d = new Date();
  if (RESEARCH.pinnedNow) d.setHours(RESEARCH.pinnedNow[0], RESEARCH.pinnedNow[1], 0, 0);
  return d;
};

/* ---- time formatting: "7:00 - 8:00 AM", "10:00 AM - 2:00 PM" ---- */
const h12 = (h) => { const x = Math.floor(h) % 12; return x === 0 ? 12 : x; };
const mins = (h) => Math.round((h - Math.floor(h)) * 60);
const mer = (h) => (Math.floor(h) % 24) < 12 ? 'AM' : 'PM';
const clock = (h) => `${h12(h)}:${String(mins(h)).padStart(2, '0')}`;
function timeRange(start, end) {
  return mer(start) === mer(end)
    ? `${clock(start)} - ${clock(end)} ${mer(end)}`
    : `${clock(start)} ${mer(start)} - ${clock(end)} ${mer(end)}`;
}
// Blocks can wrap past midnight (22:00-02:00), so a plain start<=h<end test
// misses the late-night show.
function showAt(station, hour) {
  return (station.shows || []).find((s) =>
    s.start <= s.end ? (hour >= s.start && hour < s.end)
                     : (hour >= s.start || hour < s.end)
  ) || null;
}

/* ---- data ---- */
function currentMarket() {
  const m = window.LRD_US.markets.find((x) => x[0] === state.marketId);
  return m ? { id: m[0], city: m[1], state: m[2], count: m[3], label: `${m[1]}, ${m[2]}` }
           : { id: state.marketId, city: '', state: '', count: 0, label: '' };
}

function buildStations() {
  const ids = window.LRD_US.lineups[state.marketId] || [];
  const label = currentMarket().label;

  return ids.map((id) => {
    const s = window.LRD_US.stations[id];
    if (!s) return null;
    const st = {
      id: `s${id}`, apiId: id, name: s.name, dial: s.dial, callLetters: s.call,
      genre: s.genre, description: s.desc, logo: s.logo, stream: s.stream,
      location: label,
      // Real schedule if the station publishes one, otherwise none. Nothing is
      // generated: a made-up show name on a real station reads as a bug.
      shows: (window.LRD_ONAIR[id] || []).map(([start, end, title]) => ({ start, end, title })),
    };
    const m = (st.dial || '').match(/(\d+(?:\.\d+)?)/);
    st.frequency = m ? parseFloat(m[1]) : 0;
    st.isAM = /AM/i.test(st.dial || '');
    st.isDigital = !m;
    return st;
  }).filter(Boolean).sort((a, b) =>
    (a.isDigital - b.isDigital) || (a.isAM - b.isAM) || (a.frequency - b.frequency)
  );
}

function switchMarket(id) {
  state.marketId = id;
  state.stations = buildStations();
  const first = state.stations[0];
  if (first) {
    state.currentId = first.id;
    state.track = null;
    loadTrack(first.id);
    if (audio && first.stream) { audio.pause(); audio.src = first.stream; }
    state.playing = false;
  }
  state.filter = { chip: null, genre: null, location: null };
}

function visibleStations() {
  let list = state.stations;
  if (state.filter.chip === 'presets') list = list.filter((s) => state.favorites.has(s.id));
  if (state.filter.genre) list = list.filter((s) => s.genre === state.filter.genre);
  if (state.filter.location) list = list.filter((s) => s.location === state.filter.location);
  return list;
}

/* ---- now playing track ----
 * https://us.api.iheart.com/api/v3/live-meta/stream/<id>/trackHistory?limit=1
 * is the same live-meta service the iOS app reads (LiveMetadataEndpoint). It
 * serves Access-Control-Allow-Origin: *, so the browser can call it directly.
 * Talk, news and sports stations have no track feed and return nothing, which
 * is the expected case rather than a failure.
 */
let trackTimer;

async function loadTrack(stationId) {
  if (!RESEARCH.liveTrackData) return;
  const st = state.stations.find((s) => s.id === stationId);
  if (!st) return;
  try {
    const r = await fetch(`https://us.api.iheart.com/api/v3/live-meta/stream/${st.apiId}/trackHistory?limit=1`);
    if (!r.ok) throw new Error(String(r.status));
    const t = (await r.json()).data?.[0];
    // The station may have changed while this was in flight.
    if (state.currentId !== stationId) return;
    state.track = t && t.title ? {
      title: t.title,
      artist: t.artist || '',
      // The API hands back http, which a https page blocks as mixed content.
      art: t.imagePath ? t.imagePath.replace(/^http:/, 'https:') : null,
    } : null;
  } catch (e) {
    if (state.currentId === stationId) state.track = null;
  }
  renderNowPlaying();
}

function watchTrack() {
  clearInterval(trackTimer);
  if (!RESEARCH.liveTrackData) return;
  trackTimer = setInterval(() => loadTrack(state.currentId), 30000);
}

/* ---- audio ---- */
let audio;
function setStation(id, play) {
  const st = state.stations.find((s) => s.id === id);
  if (!st) return;
  state.currentId = id;
  state.liked = state.disliked = false;
  state.track = null;          // drop the old station's track immediately
  loadTrack(id);
  noteRecent(id);
  if (audio && st.stream) {
    audio.src = st.stream;
    if (play) { const p = audio.play(); if (p && p.catch) p.catch(() => {}); }
  }
  render();
}
function flashError(msg) {
  const el = $('error');
  el.textContent = msg; el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 4000);
}

/* ---- render ---- */
const CHIPS = [
  { id: 'presets',  label: 'Presets' },
  { id: 'yours',    label: 'Your Stations' },
  { id: 'location', label: 'New York, NY', leading: 'assets/v2/chip-location.svg' },
  { id: 'genre',    label: 'All Genres',   trailing: 'assets/v2/chip-chevron.svg' },
];

function renderChips() {
  const host = $('chips');
  host.innerHTML = '';
  CHIPS.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'chip';
    const active = c.id === 'genre'    ? !!state.filter.genre
                 : c.id === 'location' ? false
                 : state.filter.chip === c.id;
    b.setAttribute('aria-pressed', String(active));
    const label = c.id === 'genre'    && state.filter.genre    ? state.filter.genre
                : c.id === 'location' ? (state.locationMethod === 'zip' && state.zip ? state.zip : currentMarket().label)
                : c.label;
    b.innerHTML =
      (c.leading ? `<img class="icon" src="${c.leading}" alt="">` : '') +
      `<span>${label}</span>` +
      (c.trailing ? `<img class="icon" src="${c.trailing}" alt="">` : '');
    b.addEventListener('click', () => onChip(c.id));
    host.appendChild(b);
  });
}

function onChip(id) {
  if (id === 'genre' || id === 'location') { openSheet(id); return; }
  state.filter.chip = state.filter.chip === id ? null : id;
  render();
}

/* ---- bottom sheet: genre and location pickers ---- */
const SHEETS = {
  genre: {
    title: 'Genre',
    allLabel: 'All Genres',
    valueOf: (s) => s.genre,
    get: () => state.filter.genre,
    set: (v) => { state.filter.genre = v; },
  },
};

/* The location sheet follows the iOS app rather than a flat city list.
 * iHeart/SharedUI/Headers/SectionHeaderDropdownPills/LocationSheet.swift offers
 * three selection METHODS, each a 64px row with a location-services icon that
 * is filled for the active method and unfilled for the others:
 *
 *   1. Use Current Location  (subtitle: the resolved location)
 *   2. Use Zip Code          (subtitle: the entered zip, when that is the method)
 *   3. Choose a City         (pushes LocationPickerView)
 *
 * Header title is "Update Location". On iOS the city picker is two wheel
 * pickers, country and city; a scrolling list is the web equivalent.
 */
// Stands in for CoreLocation. The prototype cannot detect a real location, so
// "Use Current Location" always resolves here, and it is also the market the
// app opens on.
const DETECTED_MARKET = { id: 159, label: 'New York, NY' };
const DETECTED_ZIPS = ['10001', '10002', '10003', '10011', '11201', '11211', '07030'];

function openSheet(kind) { state.sheet = kind; state.sheetPage = 'main'; renderSheet(); }
function closeSheet() { state.sheet = null; renderSheet(); }

function renderSheet() {
  const kind = state.sheet;
  const scrim = $('scrim'), sheet = $('sheet');
  if (!kind) { scrim.hidden = sheet.hidden = true; return; }
  scrim.hidden = sheet.hidden = false;
  $('sheetFooter').hidden = (kind === 'row');
  if (kind === 'row') return renderRowSheet();
  if (kind === 'location') return renderLocationSheet();
  return renderValueSheet(kind);
}

/* A plain list of values with counts. Used by the genre sheet. */
function renderValueSheet(kind) {
  const cfg = SHEETS[kind];
  const counts = {};
  state.stations.forEach((s) => {
    const v = cfg.valueOf(s);
    if (v) counts[v] = (counts[v] || 0) + 1;
  });
  const values = Object.keys(counts).sort();
  const current = cfg.get();

  $('sheetTitle').textContent = cfg.title;
  $('sheetNote').hidden = true;
  $('sheetBack').hidden = true;

  const host = $('sheetOptions');
  host.innerHTML = '';
  [{ v: null, label: cfg.allLabel, count: null }]
    .concat(values.map((v) => ({ v, label: v, count: counts[v] })))
    .forEach((opt) => {
      const b = document.createElement('button');
      b.className = 'option';
      b.setAttribute('aria-selected', String(current === opt.v));
      b.innerHTML =
        `<span class="label"><span class="name">${opt.label}</span>` +
        (opt.count != null ? `<span class="count">(${opt.count})</span>` : '') + '</span>' +
        (current === opt.v ? '<img class="icon" src="assets/v2/check.svg" alt="">' : '');
      b.addEventListener('click', () => { cfg.set(opt.v); renderSheet(); render(); });
      host.appendChild(b);
    });
}


/* ---- row overflow sheet ----
 * Options and their toggling behaviour follow the iOS app's radio overflow menu
 * (iHeart/SharedUI/Menu/View/OverflowMenu+Radio.swift): Presets and Library
 * each flip their label and icon depending on whether the station is already
 * saved. Icons are the real BottomSheet.xcassets glyphs.
 *
 * "Go to Station" is not an iOS MenuOption — the app has no goToStation case —
 * but it is in v1's media sheet and was asked for here, so it uses the dial
 * button icon.
 */
function renderRowSheet() {
  const st = state.stations.find((s) => s.id === state.rowStation);
  if (!st) return closeSheet();

  const inPresets = state.favorites.has(st.id);
  const inLibrary = state.library.has(st.id);

  const items = [
    { icon: inPresets ? 'delete-dash-circle' : 'add-to-preset',
      label: inPresets ? 'Remove from Presets' : 'Add to Preset',
      run: () => { toggleFavorite(st.id); renderSheet(); } },
    { icon: inLibrary ? 'remove-from' : 'add-to',
      label: inLibrary ? 'Remove from Library' : 'Add to Library',
      run: () => { toggleLibrary(st.id); renderSheet(); } },
    { icon: 'go-to-station', label: 'Go to Station',
      run: () => { closeSheet(); flashError(`${st.name} has no station page in this prototype`); } },
    { icon: 'share', label: 'Share',
      run: () => shareStation(st) },
  ];

  $('sheetTitle').textContent = st.name;
  $('sheetBack').hidden = true;
  $('sheetNote').hidden = true;

  const host = $('sheetOptions');
  host.innerHTML = '';
  items.forEach((it) => {
    const b = document.createElement('button');
    b.className = 'action-row';
    b.innerHTML = `<img class="icon" src="assets/sheet/${it.icon}.svg" alt="">` +
                  `<span class="name">${it.label}</span>`;
    b.addEventListener('click', it.run);
    host.appendChild(b);
  });
}

function toggleLibrary(id) {
  state.library.has(id) ? state.library.delete(id) : state.library.add(id);
  try { localStorage.setItem('lrdV2Library', JSON.stringify([...state.library])); } catch (e) {}
}

async function shareStation(st) {
  const url = location.href;
  const text = `${st.name} — ${st.description || st.genre}`;
  try {
    if (navigator.share) { await navigator.share({ title: st.name, text, url }); closeSheet(); return; }
    await navigator.clipboard.writeText(`${text} ${url}`);
    closeSheet(); flashError('Link copied');
  } catch (e) {
    closeSheet();   // the user dismissed the share sheet, which is not an error
  }
}

function renderLocationSheet() {
  const host = $('sheetOptions');
  host.innerHTML = '';
  const market = currentMarket();

  if (state.sheetPage === 'cities') {
    $('sheetTitle').textContent = 'Choose a City';
    $('sheetBack').hidden = false;
    $('sheetNote').hidden = true;

    // 251 markets is too many to scroll, so the list is filtered by a search
    // field. iOS uses two wheel pickers (country then city) for the same job.
    const search = document.createElement('input');
    search.className = 'city-search';
    search.type = 'search';
    search.placeholder = 'Search cities';
    search.value = state.citySearch;
    search.addEventListener('input', () => {
      state.citySearch = search.value;
      renderLocationSheet();
      const again = host.querySelector('.city-search');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
    host.appendChild(search);

    const q = state.citySearch.trim().toLowerCase();
    const matches = window.LRD_US.markets
      .filter((m) => !q || `${m[1]}, ${m[2]}`.toLowerCase().includes(q))
      .slice(0, 60);

    if (!matches.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No cities match "' + state.citySearch + '".';
      host.appendChild(p);
      return;
    }

    matches.forEach((m) => {
      const selected = m[0] === state.marketId;
      const b = document.createElement('button');
      b.className = 'option';
      b.setAttribute('aria-selected', String(selected));
      b.innerHTML = `<span class="label"><span class="name">${m[1]}, ${m[2]}</span>` +
        `<span class="count">(${m[3]})</span></span>` +
        (selected ? '<img class="icon" src="assets/v2/check.svg" alt="">' : '');
      b.addEventListener('click', () => {
        switchMarket(m[0]);
        state.locationMethod = 'picker';
        state.sheetPage = 'main';
        state.citySearch = '';
        renderSheet(); render();
      });
      host.appendChild(b);
    });
    return;
  }

  $('sheetTitle').textContent = 'Update Location';
  $('sheetBack').hidden = true;
  $('sheetNote').hidden = true;

  const rows = [
    { m: 'current', title: 'Use Current Location', sub: DETECTED_MARKET.label },
    { m: 'zip',     title: 'Use Zip Code',         sub: state.locationMethod === 'zip' ? state.zip : null },
    { m: 'picker',  title: 'Choose a City',        sub: state.locationMethod === 'picker' ? market.label : null },
  ];
  rows.forEach((r) => {
    const active = state.locationMethod === r.m;
    const b = document.createElement('button');
    b.className = 'loc-row';
    b.innerHTML =
      `<span class="text"><span class="t">${r.title}</span>` +
      (r.sub ? `<span class="s">${r.sub}</span>` : '') + '</span>' +
      `<img class="icon${active ? '' : ' dim'}" src="assets/v2/location-services${active ? '' : '-unfilled'}.svg" alt="">`;
    b.addEventListener('click', () => onLocationMethod(r.m));
    host.appendChild(b);
  });
}

function onLocationMethod(method) {
  if (method === 'picker') { state.sheetPage = 'cities'; renderSheet(); return; }
  if (method === 'zip') {
    const z = prompt('Enter a ZIP code');
    if (z == null) return;
    const trimmed = z.trim();
    // iOS gates Save on ZipCodeValidator and only commits inside the success
    // branch, so a well-formed but unresolvable code never displays as your
    // location. Same rule here. Resolving a ZIP to a market needs a lookup the
    // AMP station endpoints do not expose, so only the detected market's ZIPs
    // are accepted; wire a real geocode before this is more than a demo.
    if (!/^\d{5}$/.test(trimmed)) { flashError('Enter a 5 digit ZIP code'); return; }
    if (!DETECTED_ZIPS.includes(trimmed)) {
      flashError('No stations found for ' + trimmed);
      return;
    }
    switchMarket(DETECTED_MARKET.id);
    state.zip = trimmed;
  }
  if (method === 'current') switchMarket(DETECTED_MARKET.id);
  state.locationMethod = method;
  renderSheet(); render();
}

// One station row. Shared by the Radio guide and the Search results so both
// behave identically: same play control, same overflow sheet, same states.
function stationRow(st, opts) {
  const el = document.createElement('div');
  el.className = 'station' + (st.id === state.currentId ? ' is-playing' : '');
  el.innerHTML = `
    <button class="logo" aria-label="Play ${st.name}">
      <img src="${st.logo}" alt="${st.name}">
      <span class="logo-overlay">
        <img class="glyph play" src="assets/v2/play-fill.svg" alt="">
        <img class="glyph stop" src="assets/v2/stop-fill.svg" alt="">
        <img class="glyph spin" src="assets/v2/loading.svg" alt="">
        <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </span>
    </button>
    <button class="row">
      <span class="metadata">
        <span class="show">${st.name}</span>
        <span class="when">${(opts && opts.sub) || st.description || st.genre}</span>
      </span>
      <span class="more" role="button" aria-label="More options for ${st.name}">
        <img class="icon" src="assets/v2/row-overflow.svg" alt="">
      </span>
    </button>`;
  el.dataset.id = st.id;
  el.querySelector('.logo').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleStation(st.id);
  });
  el.querySelector('.row').addEventListener('click', (e) => {
    if (e.target.closest('.more')) {
      e.stopPropagation();
      state.rowStation = st.id;
      openSheet('row');
      return;
    }
    setStation(st.id, true);
  });
  return el;
}

function renderGuide() {
  requestAnimationFrame(updateListFade);   // list length just changed
  const host = $('guide');
  const list = visibleStations();
  host.innerHTML = '';
  if (!list.length) {
    host.innerHTML = '<p class="empty">No stations match these filters.</p>';
    return;
  }
  list.forEach((st) => host.appendChild(stationRow(st)));
}

// Tapping the artwork: start this station, or stop it if it is the one playing.
function toggleStation(id) {
  if (id === state.currentId && state.playing) {
    audio.pause();
    // Live radio stops rather than pauses, so resuming rejoins the stream live.
    audio.currentTime = 0;
    return;
  }
  // Show the spinner immediately: the browser may take a moment before it
  // emits 'waiting', and a tap with no feedback reads as a dead control.
  state.buffering = true;
  renderPlayState();
  if (id === state.currentId) {
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
    return;
  }
  setStation(id, true);
}

// Only the overlay changes, so repaint that rather than rebuilding 60 rows and
// disturbing the scroll position.
function renderMini() {
  const st = state.stations.find((s) => s.id === state.currentId);
  const mini = $('miniPlayer');
  // Radio already shows artwork, metadata and transport in its sticky hero, so
  // the mini there would just be a second copy of the same controls.
  if (!st || state.view === 'radio') { mini.hidden = true; return; }
  mini.hidden = false;
  const show = showAt(st, nowHours());
  const t = state.track;
  $('miniArt').src = t && t.art ? t.art : st.logo;
  $('miniL1').textContent = st.name;
  $('miniL2').textContent = t ? t.title : (show ? show.title : st.name);
  $('miniL3').textContent = t ? t.artist : (st.description || st.genre);
  $('miniPlay').querySelector('img').src =
    state.playing ? 'assets/v2/playback-stop.svg' : 'assets/v2/playback-play.svg';
  $('miniPlay').setAttribute('aria-label', state.playing ? 'Stop' : 'Play');
}

function renderPlayState() {
  renderMini();
  document.querySelectorAll('.station').forEach((el) => {
    const isCurrent = el.dataset.id === state.currentId;
    const live = state.playing && isCurrent;
    const busy = state.buffering && isCurrent;
    el.classList.toggle('is-live', live);
    el.classList.toggle('is-buffering', busy);
    const btn = el.querySelector('.logo');
    if (btn) {
      const name = el.querySelector('.show') ? el.querySelector('.show').textContent : 'station';
      btn.setAttribute('aria-label', (busy ? 'Connecting to ' : live ? 'Stop ' : 'Play ') + name);
      btn.setAttribute('aria-busy', String(busy));
    }
  });
}

function toggleFavorite(id) {
  state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
  try { localStorage.setItem('lrdV2Favorites', JSON.stringify([...state.favorites])); } catch (e) {}
  render();
}

function renderNowPlaying() {
  const st = state.stations.find((s) => s.id === state.currentId);
  if (!st) return;
  const h = nowHours();
  const show = showAt(st, h);
  const track = state.track;

  // A song on air is the most specific thing to lead with, so it takes the
  // headline and the artwork. The show and station move to the line beneath,
  // which is how the Figma hero was drawn. Talk and news stations have no track
  // feed, so they fall back to the show, then to the station name.
  $('npArt').src = track && track.art ? track.art : st.logo;
  $('npArt').alt = track ? `${track.title} artwork` : st.name;
  $('npTitle').textContent = track ? track.title : (show ? show.title : st.name);
  $('npSubtitle').textContent =
    track  ? [track.artist, st.name].filter(Boolean).join(' • ')
  : show   ? st.name
  :          (st.description || st.genre);

  // Wide-screen only.
  const bits = [];
  if (track && show) bits.push(`<span>${show.title}</span>`);
  const left = show ? remainingIn(show, h) : null;
  if (left) { if (bits.length) bits.push('<span class="sep"></span>'); bits.push(`<span>${left} left</span>`); }
  if (st.dial)  { if (bits.length) bits.push('<span class="sep"></span>'); bits.push(`<span>${st.dial}</span>`); }
  if (st.genre) { if (bits.length) bits.push('<span class="sep"></span>'); bits.push(`<span class="pill">${st.genre}</span>`); }
  $('npMeta').innerHTML = bits.join('');
  $('npDesc').textContent = st.description || '';

  $('btnLike').setAttribute('aria-pressed', String(state.liked));
  $('btnDislike').setAttribute('aria-pressed', String(state.disliked));
}

// Decimal hour of the (pinned) clock.
function nowHours() {
  const d = now();
  return d.getHours() + d.getMinutes() / 60;
}

// "1h 40m", "40m". Handles a block that runs past midnight.
function remainingIn(show, h) {
  let end = show.end;
  if (end <= show.start && h >= show.start) end += 24;   // wraps past midnight
  const mins = Math.round((end - h) * 60);
  if (mins <= 0 || mins > 24 * 60) return null;
  const hrs = Math.floor(mins / 60), rem = mins % 60;
  return hrs ? (rem ? `${hrs}h ${rem}m` : `${hrs}h`) : `${rem}m`;
}




/* ---- bottom-of-list affordance ----
 * A fade only earns its place when the end of the list is ambiguous. With a
 * partial row showing there is already a visible cue, so the fade stays off;
 * it appears when a row boundary happens to land near the fold, which makes a
 * list with 50 more stations look finished.
 */
function updateListFade() {
  const fade = $('listFade');
  if (state.view !== 'radio') { fade.classList.remove('is-on'); return; }
  // Shown whenever the list continues, full stop. It was previously suppressed
  // when a partial row was already peeking, on the theory that the peek said
  // "more" by itself. In practice that made it appear and vanish as you
  // scrolled, which is harder to read than simply always having it.
  const remaining = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
  fade.classList.toggle('is-on', remaining > 4);
}

/* ---- stow the filter chips while scrolling down ----
 * The sticky block is tall on a phone, so the chips get out of the way as you
 * head down the list and come back the moment you scroll up. Only below 1024px:
 * the wide layout does not pin its header, so there is nothing to reclaim.
 */
function watchScroll() {
  const chips = $('chipsWrap');
  let last = window.scrollY;
  let travel = 0;          // distance travelled since the last direction change

  // Deliberately not rAF-throttled. An earlier version set a `ticking` flag and
  // cleared it inside requestAnimationFrame; when frames are throttled the flag
  // latches true and every later scroll is dropped, so the chips could stay
  // stowed while scrolling up. The handler is two classList calls.
  addEventListener('scroll', () => {
    const y = Math.max(0, window.scrollY);
    const d = y - last;
    last = y;
    updateListFade();
    if (!d) return;

    // Never stow near the top: nothing to reclaim, and it only flickers.
    if (y <= 120) { chips.classList.remove('is-stowed'); travel = 0; return; }
    // The wide layout does not pin its header, so there is nothing to gain.
    if (matchMedia('(min-width: 1024px)').matches) return;
    if (state.view !== 'radio') return;

    // Hysteresis. A single 6px threshold flipped the chips back and forth
    // during momentum scrolling, which reverses direction in small increments
    // and made them visibly flicker. Require sustained travel one way instead:
    // the counter resets whenever the direction changes, so a wobble cannot
    // accumulate into a toggle.
    if ((d > 0) !== (travel > 0)) travel = 0;
    travel += d;

    if (travel > 48)       { chips.classList.add('is-stowed');    travel = 0; }
    else if (travel < -48) { chips.classList.remove('is-stowed'); travel = 0; }
  }, { passive: true });

  // A resize can change which layout is active; start from a known state.
  addEventListener('resize', () => { chips.classList.remove('is-stowed'); travel = 0; updateListFade(); });
  updateListFade();
}


/* ---- tabs as screens ----
 * Radio is the screen this prototype is about. The others exist so a study
 * participant can move around the app instead of sitting on one screen, and so
 * the tab bar is not decoration.
 */
const VIEW_IDS = { home: 'viewHome', search: 'viewSearch', radio: 'viewRadio',
                   podcasts: 'viewPodcasts', playlists: 'viewPlaylists' };

function switchView(id) {
  state.view = id;
  // Radio runs its own sticky hero from the very top of the screen, so the app
  // header would push the artwork down and steal a second row of chrome.
  $('appHeader').hidden = (id === 'radio');
  // Search shows a plain title where the other tabs show the brand.
  $('appHeader').querySelector('.brand').hidden = (id === 'search');
  $('headerTitle').hidden = (id !== 'search');
  $('hdrSearch').hidden = (id === 'search');
  Object.entries(VIEW_IDS).forEach(([k, elId]) => {
    $(elId).classList.toggle('is-active', k === id);
  });
  // The bottom fade and the chip stow belong to the Radio list only.
  $('listFade').classList.remove('is-on');
  $('chipsWrap').classList.remove('is-stowed');
  window.scrollTo(0, 0);
  renderTabBar();
  renderMini();
  if (id === 'home')      renderHome();
  if (id === 'search')    renderSearch();
  if (id === 'podcasts')  renderPodcasts();
  if (id === 'playlists') renderPlaylists();
  if (id === 'radio')  updateListFade();
}

  '<svg class="cv" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.774 5.8494L7.99642 8.62702L5.21879 5.8494C4.9396 5.5702 4.48859 5.5702 4.2094 5.8494C3.9302 6.12859 3.9302 6.5796 4.2094 6.85879L7.4953 10.1447C7.7745 10.4239 8.2255 10.4239 8.5047 10.1447L11.7906 6.85879C12.0698 6.5796 12.0698 6.12859 11.7906 5.8494C11.5114 5.57736 11.0532 5.5702 10.774 5.8494Z" fill="currentColor"/></svg>';

/* A chip in a section header: white pill, informative blue label, optional
 * leading glyph and a trailing caret. */
function headChip(label, opts) {

function esc(t) {
  return String(t).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

/* Artwork for a ranked item, or nothing so the grey plate shows through. */
function art(item) {
  return item && item.art ? `<img src="${esc(item.art)}" alt="" loading="lazy">` : '';
}

  if (trailing) h.insertAdjacentHTML('beforeend', trailing);
  host.appendChild(h);
  return h;
}
